<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <script src="/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapNexus | VIP Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Urbanist', sans-serif; background: #020617; color: #ffffff; padding: 20px; overflow-x: hidden; }
        
        /* Continuous Background Animation */
        .liquid-mesh { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3; background: radial-gradient(circle at 20% 30%, #020617, #1e3a8a 30%, #3b82f6 65%, #4f46e5); background-size: 200% 200%; animation: liquidShift 16s ease infinite alternate; }
        @keyframes liquidShift { 0% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } 100% { background-position: 0% 50%; } }

        .container { max-width: 900px; margin: 40px auto; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(251, 191, 36, 0.3); border-radius: 24px; padding: 40px; box-shadow: 0 0 40px rgba(245, 158, 11, 0.1); position: relative; z-index: 10; }
        h1 { font-family: 'Syne', sans-serif; font-size: 2.5rem; margin-bottom: 10px; color: #fbbf24; }
        .meta-tags { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .badge { background: rgba(245, 158, 11, 0.2); color: #fbbf24; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; }
        .badge.active { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge.ended { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .grid-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 40px; }
        .btn { padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; font-family: inherit; font-size: 1rem; }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .btn-gold:hover:not(:disabled) { background: linear-gradient(135deg, #f59e0b, #b45309); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); transform: translateY(-2px); }
        .btn-dark { background: rgba(15, 23, 42, 0.8); color: white; border: 1px solid rgba(251, 191, 36, 0.3); }
        .btn-dark:hover:not(:disabled) { background: rgba(30, 41, 59, 1); border-color: #fbbf24; }
        .btn-red { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-red:hover:not(:disabled) { background: rgba(239, 68, 68, 0.2); }
        
        .vip-settings { background: rgba(0, 0, 0, 0.3); border: 1px dashed #fbbf24; padding: 20px; border-radius: 16px; margin-top: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .lucide-spin { animation: spin 1s linear infinite; }
        
        .logo-preview { max-width: 150px; max-height: 80px; border-radius: 8px; margin-top: 10px; display: none; object-fit: contain; background: rgba(255,255,255,0.05); padding: 5px; }
    </style>
</head>
<body>
    <div class="liquid-mesh"></div>
    <div class="container">
        <a href="login.html" style="color: #94a3b8; text-decoration: none; margin-bottom: 20px; display: inline-block;">&larr; Back to Events</a>
        <div style="display: flex; align-items: center; gap: 10px;">
            <i data-lucide="crown" style="color: #fbbf24; width: 32px; height: 32px;"></i>
            <h1 id="dashEventName">Loading...</h1>
        </div>
        <p style="color: #94a3b8; margin-bottom: 20px;">VIP Host Dashboard</p>
        
        <div class="meta-tags">
            <span class="badge" id="dashEventId">ID: Loading</span>
            <span class="badge" id="dashEventStatus">Status: Loading</span>
        </div>
        
        <div class="grid-buttons">
            <button class="btn btn-gold" id="openTvBtn"><i data-lucide="monitor-play"></i> Open VIP TV Wall</button>
            <button class="btn btn-dark" id="openQrBtn"><i data-lucide="share-2"></i> Copy Guest Link</button>
            <button class="btn btn-red" id="endEventBtn"><i data-lucide="lock"></i> Lock / End Event</button>
        </div>

        <div class="vip-settings" id="vipSettings">
            <h3 style="color: #fbbf24; margin-bottom: 10px; font-family: 'Syne';"><i data-lucide="image"></i> Custom TV Watermark</h3>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px;">Upload a .png or .svg logo to overlay on your ad-free TV experience.</p>
            <div style="display: flex; gap: 15px; align-items: flex-start; flex-wrap: wrap;">
                <div>
                    <input type="file" id="watermarkInput" accept="image/svg+xml, image/png" style="color: white; margin-bottom: 10px; display: block; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
                    <button class="btn btn-dark" id="uploadWatermarkBtn" style="padding: 10px 20px;"><i data-lucide="upload"></i> Upload Logo</button>
                </div>
                <div>
                    <img id="logoPreview" class="logo-preview" src="">
                    <div id="noLogoText" style="color: #cbd5e1; font-size: 0.85rem; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px;">No custom logo uploaded</div>
                </div>
            </div>
        </div>

        <div style="background: rgba(0, 0, 0, 0.3); border: 1px dashed #fbbf24; padding: 20px; border-radius: 16px; margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
                <div>
                    <h3 style="font-family: 'Syne'; font-size: 1.4rem; color: #fbbf24;">Data Export</h3>
                    <p style="color: #94a3b8; font-size: 0.95rem; margin-top: 5px;">Download all photos as a ZIP file (VIP Unrestricted).</p>
                </div>
                <button class="btn btn-gold" id="downloadZipBtn" style="padding: 10px 20px;"><i data-lucide="download"></i> Download Gallery (ZIP)</button>
            </div>
        </div>

        <div id="hostGalleryContainer" style="margin-top: 40px; border-top: 1px solid rgba(251, 191, 36, 0.2); padding-top: 40px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-family: 'Syne'; margin: 0; font-size: 1.8rem; color: #fbbf24;"><i data-lucide="zap" style="width: 20px; display: inline-block; vertical-align: middle;"></i> Live VIP Gallery</h2>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 0.8rem; color: #10b981; display:flex; align-items:center; gap:4px;"><span style="width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block;animation:pulse 2s infinite;"></span> Live Sync</span>
                    <button class="btn btn-dark" id="refreshGalleryBtn" style="padding: 10px 15px; font-size: 0.9rem; border-color: rgba(255,255,255,0.1);"><i data-lucide="refresh-cw"></i> Refresh</button>
                </div>
            </div>
            <div id="hostGallery" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px;">
                <!-- Gallery items will be populated here -->
            </div>
        </div>
    </div>
    
    <style>@keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }</style>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event');
        
        if (!eventId) {
            window.location.href = 'login.html';
            throw new Error("Halt");
        }

        let currentEvent = null;

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            
            let userPrefs = null;
            try { 
                await account.get(); 
                userPrefs = await account.getPrefs();
            } catch(e) { window.location.href = 'login.html'; throw new Error("Halt"); }

            try {
                const res = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [ Appwrite.Query.equal('eventId', eventId) ]);
                if (res.documents.length === 0) { 
                    window.location.href = `dashboard.html?event=${eventId}`;
                    throw new Error("Unauthorized: Not VIP"); 
                }
                
                currentEvent = res.documents[0];
                
                // 1. Strict Tier Checks & VIP Bouncer
                let currentTier = currentEvent.tier;
                if (userPrefs && userPrefs.subExpiry && userPrefs.tier === 'vip' && Date.now() > userPrefs.subExpiry) {
                    await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, currentEvent.$id, { tier: 'starter' });
                    await account.updatePrefs({ tier: 'starter', subExpiry: null });
                    currentTier = 'starter';
                    userPrefs.tier = 'starter';
                }

                if (currentTier !== 'vip' || !userPrefs || userPrefs.tier !== 'vip') {
                    window.location.href = `dashboard.html?event=${eventId}`;
                    throw new Error("Unauthorized: Not VIP");
                }
                
                document.getElementById('dashEventName').innerText = currentEvent.eventName;
                document.getElementById('dashEventId').innerText = "ID: " + currentEvent.eventId;
                
                const statusBadge = document.getElementById('dashEventStatus');
                statusBadge.innerText = "Status: " + currentEvent.status.toUpperCase();
                
                if (currentEvent.status === 'ended') {
                    statusBadge.classList.replace('badge', 'badge');
                    statusBadge.classList.add('ended');
                    document.getElementById('endEventBtn').style.display = 'none';
                    document.getElementById('openQrBtn').style.display = 'none';
                    document.getElementById('openTvBtn').style.display = 'none';
                } else {
                    statusBadge.classList.add('active');
                }
                
                // Try to load any existing watermark from storage
                const existingLogoUrl = `${cfg.ENDPOINT}/storage/buckets/${cfg.BUCKET_ID}/files/${currentEvent.eventId}_logo/view?project=${cfg.PROJECT_ID}`;
                const imgCheck = new Image();
                imgCheck.onload = () => {
                    const preview = document.getElementById('logoPreview');
                    preview.src = existingLogoUrl;
                    preview.style.display = 'block';
                    document.getElementById('noLogoText').style.display = 'none';
                };
                imgCheck.src = existingLogoUrl;

                document.getElementById('openTvBtn').addEventListener('click', () => {
                    window.open(`tv_2.html?event=${currentEvent.eventId}`, '_blank');
                });

                document.getElementById('downloadZipBtn').addEventListener('click', () => {
                    alert("Preparing VIP High-Res ZIP! (simulated download logic)");
                });

                document.getElementById('openQrBtn').addEventListener('click', () => {
                    navigator.clipboard.writeText(cfg.resolveUrl(`app.html?event=${currentEvent.eventId}`)).then(() => alert("VIP Guest Link Copied!"));
                });

                document.getElementById('uploadWatermarkBtn').addEventListener('click', async () => {
                    const file = document.getElementById('watermarkInput').files[0];
                    if(!file) return alert('Select an image (.png or .svg).');
                    
                    const btn = document.getElementById('uploadWatermarkBtn');
                    btn.disabled = true;
                    btn.innerHTML = '<i data-lucide="loader-2" class="lucide-spin"></i> Uploading...';
                    lucide.createIcons();
                    
                    try {
                        const adId = currentEvent.eventId + '_logo';
                        try { await storage.deleteFile(cfg.BUCKET_ID, adId); } catch(e){} 
                        const uploaded = await storage.createFile(cfg.BUCKET_ID, adId, file);
                        const viewUrl = storage.getFileView(cfg.BUCKET_ID, uploaded.$id).href;
                        
                        alert('Logo saved for VIP TV Wall!');
                        
                        document.getElementById('logoPreview').src = viewUrl;
                        document.getElementById('logoPreview').style.display = 'block';
                        document.getElementById('noLogoText').style.display = 'none';
                    } catch(err) {
                        alert("Upload failed: " + err.message);
                    }
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="upload"></i> Upload Logo';
                    lucide.createIcons();
                });

                document.getElementById('endEventBtn').addEventListener('click', async () => {
                    if(confirm("Lock event? Guests can no longer upload photos.")) {
                        await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, currentEvent.$id, { status: 'ended' });
                        window.location.reload();
                    }
                });

                const hostGallery = document.getElementById('hostGallery');
                
                const fetchAndRenderGallery = async () => {
                    try {
                        const res = await storage.listFiles(cfg.BUCKET_ID, [
                            Appwrite.Query.startsWith('name', currentEvent.eventId + '_'),
                            Appwrite.Query.orderDesc('$createdAt'),
                            Appwrite.Query.limit(50)
                        ]);
                        hostGallery.innerHTML = res.files.map(f => {
                            const url = storage.getFileView(cfg.BUCKET_ID, f.$id).href;
                            return `<div style="border-radius: 12px; overflow: hidden; border: 1px solid rgba(251,191,36,0.3); outline: 2px solid rgba(0,0,0,0); transition: 0.2s; aspect-ratio: 1; background: #000; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3);" onmouseover="this.style.transform='scale(1.05)';this.style.zIndex='10'" onmouseout="this.style.transform='scale(1)';this.style.zIndex='1'">
                                        <img src="${url}" style="width: 100%; height: 100%; object-fit: cover;">
                                    </div>`;
                        }).join('');
                        if (res.files.length === 0) {
                            hostGallery.innerHTML = '<p style="color: #94a3b8; grid-column: 1 / -1;">Waiting for live photos...</p>';
                        }
                    } catch (err) {
                        console.error('Gallery fetch error', err);
                    }
                };

                document.getElementById('refreshGalleryBtn').addEventListener('click', () => {
                    const icon = document.querySelector('#refreshGalleryBtn i');
                    icon.classList.add('lucide-spin');
                    fetchAndRenderGallery().finally(() => {
                        setTimeout(() => icon.classList.remove('lucide-spin'), 500);
                    });
                });

                fetchAndRenderGallery();
                setInterval(fetchAndRenderGallery, 10000); 

            } catch (err) { 
                console.error(err); 
            }
        });
    </script>
</body>
</html>
