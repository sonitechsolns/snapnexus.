<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>SnapNexus | Host Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        // 1. CRITICAL FIX: The Engine. Without this, the dashboard crashes on load.
        const cfg = window.SnapNexus;
        const client = new Appwrite.Client().setEndpoint(cfg.ENDPOINT).setProject(cfg.PROJECT_ID);
        const account = new Appwrite.Account(client);
        const databases = new Appwrite.Databases(client);
        const storage = new Appwrite.Storage(client);

        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event');
        
        if (!eventId) {
            window.location.href = 'login.html';
            throw new Error("No Event ID - Redirecting");
        }

        let currentEvent = null;

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            
            let userPrefs = null;
            let currentUser = null;
            
            try { 
                currentUser = await account.get(); 
                userPrefs = await account.getPrefs();
            } catch(e) { 
                window.location.href = 'login.html'; 
                throw new Error("User Not Logged In"); 
            }

            // Strict Tier Checks & VIP Bouncer
            if (userPrefs && userPrefs.tier === 'vip') {
                window.location.href = `vip_dashboard.html?event=${eventId}`;
                throw new Error("Redirecting VIP user");
            }

            try {
                const res = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [ Appwrite.Query.equal('eventId', eventId) ]);
                if (res.documents.length === 0) throw new Error("Not Found");
                currentEvent = res.documents[0];
                
                // Enforce Subscriptions and Buffer rules locally
                if (userPrefs && userPrefs.subExpiry) {
                    const now = Date.now();
                    const bufferMs = 3 * 3600000;
                    if (userPrefs.tier === 'pro' || userPrefs.tier === 'premium') {
                        if (now > userPrefs.subExpiry && currentEvent.status !== 'ended') {
                            await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, currentEvent.$id, { status: 'ended' });
                            currentEvent.status = 'ended';
                            alert("Subscription ended. Your event has ended, but you have a 3-hour buffer to download files.");
                        }
                        if (now > userPrefs.subExpiry + bufferMs && currentEvent.tier !== 'starter') {
                            await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, currentEvent.$id, { tier: 'starter' });
                            await account.updatePrefs({ tier: 'starter', subExpiry: null });
                            currentEvent.tier = 'starter';
                            userPrefs.tier = 'starter';
                            window.location.reload();
                        }
                    }
                }

                document.getElementById('dashEventName').innerText = currentEvent.eventName;
                document.getElementById('dashEventId').innerText = "ID: " + currentEvent.eventId;
                
                const tierBadge = document.getElementById('dashEventTier');
                tierBadge.innerText = "Tier: " + currentEvent.tier.toUpperCase();
                if(currentEvent.tier === 'vip') tierBadge.classList.add('vip');
                if(currentEvent.tier === 'pro' || currentEvent.tier === 'premium') tierBadge.classList.add('pro');
                
                const statusBadge = document.getElementById('dashEventStatus');
                statusBadge.innerText = "Status: " + currentEvent.status.toUpperCase();
                if (currentEvent.status === 'ended') {
                    statusBadge.style.color = '#ef4444';
                    statusBadge.style.backgroundColor = 'rgba(239, 68, 68, 0.2)';
                    document.getElementById('endEventBtn').style.display = 'none';
                    document.getElementById('openQrBtn').style.display = 'none';
                }

                // Data Retention Timers
                const downloadBtn = document.getElementById('downloadZipBtn');
                const upsellText = document.getElementById('upsellText');
                
                if (currentEvent.tier === 'starter') {
                    const eventAgeMs = Date.now() - new Date(currentEvent.$createdAt).getTime();
                    const hours24 = 24 * 60 * 60 * 1000;
                    if (eventAgeMs > hours24) {
                        downloadBtn.disabled = true;
                        downloadBtn.innerHTML = '<i data-lucide="lock"></i> Gallery Expired';
                        upsellText.style.display = 'block';
                        upsellText.style.color = '#ef4444';
                        upsellText.innerText = "Downloads expire in 24 hours on the Free plan. Upgrade to Pro (₹499) to unlock 30-day gallery retention!";
                        lucide.createIcons();
                    }
                }

                document.getElementById('openTvBtn').addEventListener('click', () => {
                    if (currentEvent.tier === 'pro' || currentEvent.tier === 'premium' || currentEvent.tier === 'vip') {
                        window.open(`tv_2.html?event=${currentEvent.eventId}`, '_blank');
                    } else {
                        window.open(`tv.html?event=${currentEvent.eventId}`, '_blank');
                    }
                });

                document.getElementById('openQrBtn').addEventListener('click', () => {
                    navigator.clipboard.writeText(cfg.resolveUrl(`app.html?event=${currentEvent.eventId}`)).then(() => alert("Guest Link Copied!"));
                });

                // Upgrade Plan Logic (Stripped of Fake APIs)
                const upgradeBtn = document.getElementById('upgradeBtn');
                const upgradeModal = document.getElementById('upgradeModal');
                const closeModalBtn = document.getElementById('closeModalBtn');
                const selectProBtn = document.getElementById('selectProBtn');
                const selectPremiumBtn = document.getElementById('selectPremiumBtn');
                const selectVipBtn = document.getElementById('selectVipBtn');

                if (currentEvent.tier !== 'vip' && currentEvent.status !== 'ended') {
                    upgradeBtn.style.display = 'flex';
                    upgradeBtn.addEventListener('click', () => { upgradeModal.style.display = 'flex'; lucide.createIcons(); });
                    closeModalBtn.addEventListener('click', () => { upgradeModal.style.display = 'none'; });

                    const handleCheckout = (amount, planName, tierId) => {
                        if (!confirm("By proceeding with this payment, you agree to our Privacy Policy and Terms of Service.")) return;

                        const options = {
                            key: 'rzp_test_Sf5GBrljv03Pmk', 
                            amount: amount * 100,
                            currency: 'INR', 
                            name: 'SnapNexus', 
                            description: `Upgrade to ${planName}`,
                            handler: async function (response) {
                                // Update User & Event Tier instantly
                                const subExpiry = Date.now() + 30 * 24 * 60 * 60 * 1000;
                                await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, currentEvent.$id, { tier: tierId });
                                await account.updatePrefs({ tier: tierId, subExpiry: subExpiry });
                                
                                try {
                                    const res = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [
                                        Appwrite.Query.equal('hostEmail', currentUser.email),
                                        Appwrite.Query.equal('status', 'active')
                                    ]);
                                    for (let doc of res.documents) {
                                        await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, doc.$id, { tier: tierId });
                                    }
                                } catch(e) { console.error('Failed to sync events', e); }
                                
                                upgradeModal.style.display = 'none';
                                
                                // Show Official Receipt Popup
                                const txnId = response.razorpay_payment_id || "TXN_" + Math.random().toString(36).substr(2,9).toUpperCase();
                                document.getElementById('rDate').innerText = new Date().toLocaleString();
                                document.getElementById('rPlan').innerText = planName;
                                document.getElementById('rAmount').innerText = "₹" + amount;
                                document.getElementById('rTxn').innerText = txnId;
                                
                                document.getElementById('receiptPopup').style.display = 'flex';
                            }
                        };
                        upgradeModal.style.display = 'none';
                        new window.Razorpay(options).open();
                    };

                    if (currentEvent.tier === 'premium') {
                        selectProBtn.style.display = 'none';
                        selectPremiumBtn.style.display = 'none';
                        selectVipBtn.style.display = 'none';
                    } else if (currentEvent.tier === 'pro') {
                        selectProBtn.style.display = 'none';
                        selectPremiumBtn.querySelector('h3').innerText = 'Premium Plan Upgrade — ₹500';
                        selectPremiumBtn.addEventListener('click', () => handleCheckout(500, 'Premium Plan (Upgrade)', 'premium'));
                        selectVipBtn.style.display = 'none';
                    } else {
                        selectProBtn.addEventListener('click', () => handleCheckout(499, 'Pro Plan', 'pro'));
                        selectPremiumBtn.addEventListener('click', () => handleCheckout(999, 'Premium Plan', 'premium'));
                        selectVipBtn.addEventListener('click', () => handleCheckout(2999, 'VIP Plan', 'vip'));
                    }
                }

                document.getElementById('closeReceiptBtn').addEventListener('click', () => {
                    window.location.reload();
                });

                document.getElementById('endEventBtn').addEventListener('click', async () => {
                    if(confirm("End event? Guests can no longer upload.")) {
                        await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, currentEvent.$id, { status: 'ended' });
                        window.location.reload();
                    }
                });

                // Gallery & Hover Tools
                const hostGalleryContainer = document.getElementById('hostGalleryContainer');
                const hostGallery = document.getElementById('hostGallery');
                hostGalleryContainer.style.display = 'block';

                const fetchAndRenderGallery = async () => {
                    try {
                        const res = await storage.listFiles(cfg.BUCKET_ID, [
                            Appwrite.Query.startsWith('name', currentEvent.eventId + '_'),
                            Appwrite.Query.orderDesc('$createdAt'),
                            Appwrite.Query.limit(50)
                        ]);
                        hostGallery.innerHTML = res.files.map(f => {
                            const url = storage.getFileView(cfg.BUCKET_ID, f.$id).href;
                            return `<div style="border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); aspect-ratio: 1; background: #000; position: relative;" onmouseenter="this.querySelector('.hover-overlay').style.opacity='1';" onmouseleave="this.querySelector('.hover-overlay').style.opacity='0';">
                                        <img src="${url}" style="width: 100%; height: 100%; object-fit: cover;">
                                        <div class="hover-overlay" style="position: absolute; inset: 0; background: rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 15px;">
                                            <button onclick="downloadImage('${f.$id}', '${f.name.replace(/'/g, "\\'")}')" style="background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white;"><i data-lucide="download"></i></button>
                                            <button onclick="deleteImage('${f.$id}')" style="background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer;"><i data-lucide="trash-2" style="color: #ef4444;"></i></button>
                                        </div>
                                    </div>`;
                        }).join('');
                        lucide.createIcons();
                        if (res.files.length === 0) {
                            hostGallery.innerHTML = '<p style="color: #94a3b8; grid-column: 1 / -1;">No photos have been uploaded yet.</p>';
                        }
                    } catch (err) { console.error('Gallery fetch error', err); }
                };

                window.downloadImage = async (fileId, fileName) => {
                    try {
                        const dlUrl = storage.getFileDownload(cfg.BUCKET_ID, fileId).href;
                        const response = await fetch(dlUrl);
                        const blob = await response.blob();
                        const blobUrl = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = blobUrl;
                        a.download = fileName || "SnapNexus_Photo.jpg";
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(blobUrl);
                    } catch(err) { alert("Failed to download image."); }
                };

                window.deleteImage = async (fileId) => {
                    if (!confirm("Are you sure you want to permanently delete this photo?")) return;
                    try {
                        await storage.deleteFile(cfg.BUCKET_ID, fileId);
                        fetchAndRenderGallery();
                    } catch(err) { alert("Failed to delete image: " + err.message); }
                };

                // Real Browser ZIP Download Implementation
                if (downloadBtn) {
                    downloadBtn.addEventListener('click', async () => {
                        if (currentEvent.tier === 'starter') {
                            alert("ZIP Downloads are available on Premium & VIP plans. Please upgrade to download your gallery.");
                            return;
                        }

                        downloadBtn.innerHTML = '<i data-lucide="loader-2" class="lucide-spin"></i> Zipping...';
                        downloadBtn.disabled = true;
                        lucide.createIcons();

                        try {
                            const res = await storage.listFiles(cfg.BUCKET_ID, [
                                Appwrite.Query.startsWith('name', currentEvent.eventId + '_'),
                                Appwrite.Query.limit(100) 
                            ]);

                            if (res.files.length === 0) {
                                alert("There are no photos to download!");
                                downloadBtn.innerHTML = '<i data-lucide="download"></i> Download Gallery (ZIP)';
                                downloadBtn.disabled = false;
                                lucide.createIcons();
                                return;
                            }

                            const zip = new JSZip();
                            const downloadPromises = res.files.map(async (file) => {
                                const dlUrl = storage.getFileDownload(cfg.BUCKET_ID, file.$id).href;
                                try {
                                    const response = await fetch(dlUrl);
                                    const blobData = await response.blob();
                                    zip.file(file.name, blobData);
                                } catch(e) { console.error("Failed to fetch", file.$id, e); }
                            });

                            await Promise.all(downloadPromises);
                            const content = await zip.generateAsync({ type: "blob" });
                            saveAs(content, "SnapNexus_" + currentEvent.eventName + ".zip");

                        } catch (err) {
                            console.error("ZIP Error", err);
                            alert("Failed to generate ZIP.");
                        } finally {
                            downloadBtn.innerHTML = '<i data-lucide="download"></i> Download Gallery (ZIP)';
                            downloadBtn.disabled = false;
                            lucide.createIcons();
                        }
                    });
                }

                document.getElementById('refreshGalleryBtn').addEventListener('click', () => {
                    const icon = document.querySelector('#refreshGalleryBtn i');
                    icon.classList.add('lucide-spin');
                    fetchAndRenderGallery().finally(() => { setTimeout(() => icon.classList.remove('lucide-spin'), 500); });
                });

                fetchAndRenderGallery();
                setInterval(fetchAndRenderGallery, 15000);

            } catch (err) { 
                alert("Event not found or failed to load. Redirecting to Login.");
                window.location.href = 'login.html';
                console.error(err); 
            }
        });
    </script>
</body>
</html>
