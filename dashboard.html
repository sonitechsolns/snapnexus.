<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <script src="/config.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapNexus | Host Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Urbanist', sans-serif; background: #020617; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 40px auto; background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 40px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 2.5rem; margin-bottom: 10px; }
        .meta-tags { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .badge { background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; }
        .badge.vip { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .grid-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 40px; }
        .btn { padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; font-family: inherit; font-size: 1rem; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-blue:hover { background: #2563eb; }
        .btn-dark { background: rgba(15, 23, 42, 0.8); color: white; border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-dark:hover { background: rgba(30, 41, 59, 1); }
        .btn-red { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .vip-settings { background: rgba(0, 0, 0, 0.3); border: 1px dashed #fbbf24; padding: 20px; border-radius: 16px; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="login.html" style="color: #94a3b8; text-decoration: none; margin-bottom: 20px; display: inline-block;">&larr; Back to Events</a>
        <h1 id="dashEventName">Loading...</h1>
        <div class="meta-tags">
            <span class="badge" id="dashEventId">ID: Loading</span>
            <span class="badge" id="dashEventTier">Tier: Loading</span>
            <span class="badge" id="dashEventStatus">Status: Loading</span>
        </div>
        <div class="grid-buttons">
            <button class="btn btn-blue" id="openTvBtn"><i data-lucide="monitor"></i> Open TV Display</button>
            <button class="btn btn-dark" id="openQrBtn"><i data-lucide="smartphone"></i> Copy Guest Link</button>
            <button class="btn btn-gold" id="upgradeBtn" style="display: none;"><i data-lucide="zap"></i> Upgrade VIP (₹2999)</button>
            <button class="btn btn-red" id="endEventBtn"><i data-lucide="power"></i> End Event</button>
        </div>
        <div class="vip-settings" id="vipSettings">
            <h3 style="color: #fbbf24; margin-bottom: 10px;"><i data-lucide="crown"></i> VIP Custom Watermark</h3>
            <input type="file" id="watermarkInput" accept="image/svg+xml, image/png" style="color: white; margin-bottom: 10px;">
            <button class="btn btn-blue" id="uploadWatermarkBtn" style="padding: 10px 20px;">Upload Logo</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event');
        
        // FIXED BLANK SCREEN CRASH
        if (!eventId) {
            window.location.href = 'login.html';
            throw new Error("Redirecting to login");
        }

        let currentEvent = null;

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            try { await account.get(); } catch(e) { window.location.href = 'login.html'; throw new Error("Redirecting"); }

            try {
                const res = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [ Appwrite.Query.equal('eventId', eventId) ]);
                if (res.documents.length === 0) { alert('Event not found.'); window.location.href = 'login.html'; throw new Error("Redirecting"); }
                
                currentEvent = res.documents[0];
                document.getElementById('dashEventName').innerText = currentEvent.eventName;
                document.getElementById('dashEventId').innerText = "ID: " + currentEvent.eventId;
                
                const tierBadge = document.getElementById('dashEventTier');
                tierBadge.innerText = "Tier: " + currentEvent.tier.toUpperCase();
                if(currentEvent.tier === 'vip') tierBadge.classList.add('vip');
                document.getElementById('dashEventStatus').innerText = "Status: " + currentEvent.status.toUpperCase();

                document.getElementById('openTvBtn').addEventListener('click', () => {
                    const tvFile = currentEvent.tier === 'vip' ? 'tv_2.html' : 'tv.html';
                    window.open(`${tvFile}?event=${currentEvent.eventId}`, '_blank');
                });

                document.getElementById('openQrBtn').addEventListener('click', () => {
                    navigator.clipboard.writeText(cfg.resolveUrl(`app.html?event=${currentEvent.eventId}`)).then(() => alert("Guest Link Copied!"));
                });

                const upgradeBtn = document.getElementById('upgradeBtn');
                if (currentEvent.tier !== 'vip') {
                    upgradeBtn.style.display = 'flex';
                    upgradeBtn.addEventListener('click', () => {
                        const options = {
                            key: 'rzp_test_Sf5GBrljv03Pmk',
                            amount: 299900, currency: 'INR', name: 'SnapNexus VIP', description: 'Upgrade to VIP',
                            handler: async function (response) {
                                await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, currentEvent.$id, { tier: 'vip' });
                                await account.updatePrefs({ tier: 'vip' });
                                alert('Payment Successful! You are now VIP.');
                                window.location.reload();
                            }
                        };
                        new window.Razorpay(options).open();
                    });
                } else {
                    document.getElementById('vipSettings').style.display = 'block';
                    document.getElementById('uploadWatermarkBtn').addEventListener('click', async () => {
                        const file = document.getElementById('watermarkInput').files[0];
                        if(!file) return alert('Select an image.');
                        document.getElementById('uploadWatermarkBtn').innerText = 'Uploading...';
                        const uploaded = await storage.createFile(cfg.BUCKET_ID, Appwrite.ID.unique(), file);
                        const viewUrl = storage.getFileView(cfg.BUCKET_ID, uploaded.$id).href;
                        await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, currentEvent.$id, { customWatermark: viewUrl });
                        alert('Logo saved for TV Wall!');
                        document.getElementById('uploadWatermarkBtn').innerText = 'Upload Logo';
                    });
                }

                document.getElementById('endEventBtn').addEventListener('click', async () => {
                    if(confirm("End event? Guests can no longer upload.")) {
                        await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, currentEvent.$id, { status: 'ended' });
                        window.location.reload();
                    }
                });
            } catch (err) { console.error(err); }
        });
    </script>
</body>
</html>
