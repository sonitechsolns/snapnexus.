<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <script src="/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>SnapNexus | Guest Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Urbanist', sans-serif; 
            background: #020617; 
            color: #ffffff; 
            min-height: 100vh; 
            overflow-x: hidden; 
            overflow-y: auto; 
            padding: 5vh 20px;
            position: relative; 
            display: block; 
        }
        
        .main-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        .liquid-mesh { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3; background: radial-gradient(circle at 20% 30%, #020617, #1e3a8a 30%, #3b82f6 65%, #4f46e5); background-size: 200% 200%; animation: liquidShift 16s ease infinite alternate; }
        @keyframes liquidShift { 0% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } 100% { background-position: 0% 50%; } }

        .camera-ui { width: 100%; max-width: 400px; padding: 20px; text-align: center; z-index: 10; position: relative; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .logo-text { font-family: 'Syne'; font-size: 2rem; margin-bottom: 40px; color: #3b82f6; }
        .shutter-btn { width: 90px; height: 90px; border-radius: 50%; background: transparent; border: 4px solid #ffffff; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; cursor: pointer; transition: 0.2s; }
        .shutter-inner { width: 70px; height: 70px; border-radius: 50%; background: #ffffff; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .shutter-btn:active .shutter-inner { transform: scale(0.9); background: #cbd5e1; }
        .status-msg { font-size: 1.1rem; color: #e2e8f0; font-weight: 600; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="liquid-mesh"></div>
    <div class="main-wrapper">
        <div class="camera-ui">
            <h1 class="logo-text">SnapNexus</h1>
            <button class="shutter-btn" id="uploadBtn">
                <div class="shutter-inner" id="shutterInner"></div>
            </button>
            <p class="status-msg" id="statusMsg">Tap to send a photo</p>
            <input type="file" id="fileInput" accept="image/*" multiple>
        </div>

        <div class="guest-gallery-container" style="width: 100%; padding: 20px 0; z-index: 10; position: relative; margin-top: 20px;">
            <div id="guestGallery" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px;"></div>
        </div>
    </div>

    <script>
        // --- Universal Client Initialization ---
        let cfg, client, account, databases, storage;

        const isCanvasPreview = window.location.protocol === 'blob:' || window.location.origin === 'null';
        
        if (isCanvasPreview && !window.SnapNexus) {
            // Mock environment for Canvas preview protection
            cfg = { ENDPOINT: '', PROJECT_ID: '', DATABASE_ID: '', COLLECTION_ID: '', BUCKET_ID: '', resolveUrl: (p)=>p };
            account = { get: async()=>({}), getPrefs: async()=>({tier: 'vip', subExpiry: Date.now() + 100000}), updatePrefs: async()=>{} };
            databases = { listDocuments: async()=>({documents: [{ $id:'1', eventId:'demo-vip-event', eventName:'Demo Event', tier:'vip', status:'active', watermarkConfigured: false, watermarkText: 'SnapNexus Preview' }]}), updateDocument: async()=>{} };
            storage = { listFiles: async()=>({files: []}), getFileView: ()=>({href:''}), getFileDownload: ()=>({href:''}), createFile: async()=>({$id:'1'}), deleteFile: async()=>{} };
        } else {
            // REAL PRODUCTION ENVIRONMENT INIT
            cfg = window.SnapNexus;
            client = new Appwrite.Client().setEndpoint(cfg.ENDPOINT).setProject(cfg.PROJECT_ID);
            account = new Appwrite.Account(client);
            databases = new Appwrite.Databases(client);
            storage = new Appwrite.Storage(client);
        }

        const urlParams = new URLSearchParams(window.location.search);
        let eventId = urlParams.get('event');
        let isDemo = false;
        
        if (!eventId && isCanvasPreview) {
            eventId = 'demo-vip-event';
            isDemo = true;
        }

        let currentEvent = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if(typeof lucide !== 'undefined') lucide.createIcons();

            if (!eventId && !isDemo) {
                document.body.innerHTML = '<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; text-align:center;"><h2>No Event ID</h2><p>Please scan a valid event QR code.</p></div>';
                return;
            }

            try {
                const res = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [ Appwrite.Query.equal('eventId', eventId) ]);
                if (res.documents.length > 0) {
                    currentEvent = res.documents[0];
                }
            } catch (e) {
                console.warn("Could not fetch event details:", e);
            }

            document.getElementById('uploadBtn').addEventListener('click', () => {
                document.getElementById('fileInput').click();
            });

            document.getElementById('fileInput').addEventListener('change', async (e) => {
                let files = Array.from(e.target.files);
                if (files.length === 0) return;

                if (files.length > 5) {
                    alert("You can upload a maximum of 5 photos at a time. Only the first 5 will be processed.");
                    files = files.slice(0, 5);
                }

                const btn = document.getElementById('uploadBtn');
                const inner = document.getElementById('shutterInner');
                const msg = document.getElementById('statusMsg');
                
                btn.style.pointerEvents = 'none';
                inner.style.transform = 'scale(0.8)';
                
                let successCount = 0;

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    msg.innerText = files.length > 1 ? `Uploading ${i + 1} of ${files.length}...` : 'Uploading...';
                    
                    try {
                        const compressedBlob = await new Promise((resolve, reject) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                let width = img.width;
                                let height = img.height;
                                const maxDim = 1920;
                                if (width > maxDim || height > maxDim) {
                                    if (width > height) { height = Math.round(height *= maxDim / width); width = maxDim; }
                                    else { width = Math.round(width *= maxDim / height); height = maxDim; }
                                }
                                canvas.width = width;
                                canvas.height = height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, width, height);

                                const wmSize = Math.max(24, Math.floor(width * 0.04));
                                ctx.font = `800 ${wmSize}px 'Urbanist', sans-serif`;
                                ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                                ctx.shadowBlur = 12;
                                ctx.shadowOffsetX = 3;
                                ctx.shadowOffsetY = 3;
                                ctx.textAlign = 'right';
                                ctx.textBaseline = 'top';
                                
                                const watermarkText = (currentEvent && currentEvent.watermarkText) ? currentEvent.watermarkText : 'SnapNexus';
                                ctx.fillText(watermarkText, width - 20, 20);

                                canvas.toBlob(blob => { resolve(blob); }, 'image/jpeg', 0.8);
                            };
                            img.onerror = e => reject(e);
                            img.src = URL.createObjectURL(file);
                        });

                        const fileName = (currentEvent ? currentEvent.eventId : 'demo') + '_' + Date.now() + '_' + Math.random().toString(36).substring(7) + '.jpg';
                        await storage.createFile(cfg.BUCKET_ID, fileName, new File([compressedBlob], fileName, { type: 'image/jpeg' }));
                        successCount++;
                    } catch (err) {
                        console.error('Upload failed for a file:', err);
                    }
                }

                inner.style.transform = 'scale(1)';
                btn.style.pointerEvents = 'auto';
                
                if (successCount > 0) {
                    msg.innerText = files.length > 1 ? `Successfully sent ${successCount} photos!` : 'Sent successfully!';
                    try { if(typeof fetchAndRenderGuestGallery === 'function') fetchAndRenderGuestGallery(); } catch(e){}
                } else {
                    msg.innerText = 'Upload failed.';
                }

                setTimeout(() => msg.innerText = 'Tap to send a photo', 3000);
                e.target.value = ''; 
            });

            function compressImage(file, maxWidth) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = event => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;

                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            const wmSize = Math.max(24, Math.floor(width * 0.04)); 
                            ctx.font = `800 ${wmSize}px 'Urbanist', sans-serif`;
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                            ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                            ctx.shadowBlur = 12;
                            ctx.shadowOffsetX = 3;
                            ctx.shadowOffsetY = 3;
                            ctx.textAlign = 'right';
                            ctx.textBaseline = 'top';
                            ctx.fillText('SnapNexus', width - 20, 20);

                            canvas.toBlob(blob => { resolve(blob); }, 'image/jpeg', 0.8);
                        };
                        img.onerror = e => reject(e);
                    };
                    reader.onerror = e => reject(e);
                });
            }
            
            async function checkEventStatus() {
                if (isDemo) return;
                try {
                    const res = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [ Appwrite.Query.equal('eventId', eventId) ]);
                    if (res.documents.length === 0 || res.documents[0].status === 'ended') {
                        document.body.innerHTML = '<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; width:100%; background:#020617; z-index:9999; position:absolute; top:0; left:0; text-align:center;"><h1 style="font-size: 3rem; color: #ef4444; font-family:\'Syne\'; margin-bottom:10px;">Event Ended</h1><p style="color: #94a3b8; font-size: 1.2rem; padding: 0 20px;">Thanks for taking part! You can safely close this page.</p></div>';
                    }
                } catch(e) {}
            }
            setInterval(checkEventStatus, 5000);

            const guestGallery = document.getElementById('guestGallery');

            async function fetchAndRenderGuestGallery() {
                if (!guestGallery) return;
                try {
                    const res = await storage.listFiles(cfg.BUCKET_ID, [
                        Appwrite.Query.startsWith('name', eventId + '_'),
                        Appwrite.Query.orderDesc('$createdAt'),
                        Appwrite.Query.limit(50)
                    ]);
                    
                    guestGallery.innerHTML = res.files.map(f => {
                        const url = storage.getFileView(cfg.BUCKET_ID, f.$id).href;
                        return `<div style="border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); aspect-ratio: 1; background: #000; position: relative;" onmouseenter="this.querySelector('.hover-overlay').style.opacity='1';" onmouseleave="this.querySelector('.hover-overlay').style.opacity='0';">
                                    <img src="${url}" style="width: 100%; height: 100%; object-fit: cover;">
                                    <div class="hover-overlay" style="position: absolute; inset: 0; background: rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.2s ease; display: flex; align-items: center; justify-content: center;">
                                        <button onclick="downloadImage('${f.$id}', '${f.name.replace(/'/g, "\\'")}')" style="background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white;"><i data-lucide="download"></i></button>
                                    </div>
                                </div>`;
                    }).join('');
                    if(typeof lucide !== 'undefined') lucide.createIcons();
                } catch (err) { console.error('Gallery fetch error', err); }
            }

            window.downloadImage = async (fileId, fileName) => {
                try {
                    const dlUrl = storage.getFileDownload(cfg.BUCKET_ID, fileId).href;
                    const response = await fetch(dlUrl);
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = fileName || "SnapNexus_Photo.jpg";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                } catch(err) {
                    alert("Failed to download image.");
                }
            };

            fetchAndRenderGuestGallery();
            setInterval(fetchAndRenderGuestGallery, 15000);
        });
    </script>
</body>
</html>
