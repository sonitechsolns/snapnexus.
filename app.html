<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <script src="/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>SnapNexus | Guest Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Urbanist', sans-serif; background: #020617; color: #ffffff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        /* Continuous Background Animation */
        .liquid-mesh { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3; background: radial-gradient(circle at 20% 30%, #020617, #1e3a8a 30%, #3b82f6 65%, #4f46e5); background-size: 200% 200%; animation: liquidShift 16s ease infinite alternate; }
        @keyframes liquidShift { 0% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } 100% { background-position: 0% 50%; } }

        .camera-ui { width: 100%; max-width: 400px; padding: 20px; text-align: center; z-index: 10; position: relative; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .logo-text { font-family: 'Syne'; font-size: 2rem; margin-bottom: 40px; color: #3b82f6; }
        .shutter-btn { width: 90px; height: 90px; border-radius: 50%; background: transparent; border: 4px solid #ffffff; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; cursor: pointer; transition: 0.2s; }
        .shutter-inner { width: 70px; height: 70px; border-radius: 50%; background: #ffffff; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .shutter-btn:active .shutter-inner { transform: scale(0.9); background: #cbd5e1; }
        .status-msg { font-size: 1.1rem; color: #e2e8f0; font-weight: 600; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="liquid-mesh"></div>
    <div class="camera-ui">
        <h1 class="logo-text">SnapNexus</h1>
        <button class="shutter-btn" id="uploadBtn">
            <div class="shutter-inner" id="shutterInner"></div>
        </button>
        <p class="status-msg" id="statusMsg">Tap to send a photo</p>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <script>
        const cfg = window.SnapNexus;
        const client = new Appwrite.Client()
            .setEndpoint(cfg.ENDPOINT)
            .setProject(cfg.PROJECT_ID);
        const databases = new Appwrite.Databases(client);
        const storage = new Appwrite.Storage(client);

        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event');
        
        if (!eventId) {
            document.body.innerHTML = '<h2 style="color:white; text-align:center; margin-top:50px;">Invalid Link</h2>';
            throw new Error("Halt");
        }

        const isDemo = eventId.startsWith('demo_');

        document.addEventListener('DOMContentLoaded', async () => {
            const statusMsg = document.getElementById('statusMsg');
            const uploadBtn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('fileInput');

            if (!isDemo) {
                try {
                    const res = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [ Appwrite.Query.equal('eventId', eventId) ]);
                    if (res.documents.length === 0 || res.documents[0].status === 'ended') {
                        statusMsg.innerText = 'Event has ended or not found.'; uploadBtn.disabled = true; throw new Error("Halt");
                    }
                } catch (err) { statusMsg.innerText = 'Connection error.'; }
            } else { statusMsg.innerText = "Sandbox Mode Active"; }

            uploadBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                uploadBtn.disabled = true;
                statusMsg.innerText = 'Uploading...';

                // Secure Appwrite v14 filename isolation
                const safeName = `${eventId}_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
                const safeFile = new File([file], safeName, { type: file.type });

                try {
                    await storage.createFile(cfg.BUCKET_ID, Appwrite.ID.unique(), safeFile);
                    statusMsg.innerText = 'Sent to TV! 🚀';
                    setTimeout(() => { statusMsg.innerText = 'Tap to send a photo'; uploadBtn.disabled = false; }, 2000);
                } catch(err) {
                    alert('Upload failed: ' + err.message);
                    statusMsg.innerText = 'Upload failed.'; uploadBtn.disabled = false;
                }
                fileInput.value = '';
            });
            
            async function checkEventStatus() {
                if (isDemo) return;
                try {
                    const res = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [ Appwrite.Query.equal('eventId', eventId) ]);
                    if (res.documents.length === 0 || res.documents[0].status === 'ended') {
                        statusMsg.innerText = 'Event has ended.'; 
                        uploadBtn.disabled = true;
                        uploadBtn.style.borderColor = '#ef4444';
                        document.getElementById('shutterInner').style.background = '#ef4444';
                    }
                } catch(e) {}
            }
            setInterval(checkEventStatus, 15000);
        });
    </script>
</body>
</html>
