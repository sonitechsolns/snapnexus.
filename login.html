<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapNexus | Host Login</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Your exact original styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Urbanist', sans-serif; background: #020617; color: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 40px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        h1 { font-family: 'Syne', sans-serif; font-size: 2rem; margin-bottom: 8px; text-align: center; }
        p.subtitle { color: #94a3b8; text-align: center; margin-bottom: 32px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
        input { width: 100%; padding: 14px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; font-family: inherit; font-size: 1rem; transition: all 0.3s ease; }
        input:focus { outline: none; border-color: #3b82f6; background: rgba(15, 23, 42, 0.8); }
        .btn-primary { width: 100%; padding: 16px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-2px); }
        .toggle-text { text-align: center; margin-top: 24px; color: #94a3b8; cursor: pointer; font-weight: 600; transition: color 0.3s ease; }
        .toggle-text:hover { color: #ffffff; }
        .history-item { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); padding: 16px; border-radius: 12px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: space-between; align-items: center; }
        .history-item:hover { background: rgba(30, 41, 59, 0.8); border-color: #3b82f6; }
        .history-item strong { display: block; font-size: 1.1rem; margin-bottom: 4px; }
        .history-item span { font-size: 0.85rem; color: #94a3b8; }
        .badge { background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        #historySection { display: none; }
    </style>
</head>
<body>
    <div class="glass-panel">
        <h1 id="authTitle">SnapNexus Host</h1>
        <p class="subtitle" id="authSubtitle">Sign in to manage your events</p>
        <div id="authForm">
            <div class="input-group" id="nameGroup" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="nameInput" placeholder="John Doe">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="emailInput" placeholder="host@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="passwordInput" placeholder="••••••••">
            </div>
            <button class="btn-primary" id="loginBtn">Sign In <i data-lucide="arrow-right"></i></button>
            <p class="toggle-text" id="toggleAuth">Don't have an account? Create one.</p>
        </div>
        <div id="historySection">
            <button class="btn-primary" id="createNewEventBtn" style="margin-bottom: 24px; background: #10b981;">
                <i data-lucide="plus-circle"></i> Create New Event
            </button>
            <h3 style="font-family: 'Syne'; margin-bottom: 16px; font-size: 1.2rem;">Previous Events</h3>
            <div id="historyList"></div>
            <p class="toggle-text" id="logoutBtn" style="color: #ef4444; margin-top: 30px;">Sign Out</p>
        </div>
    </div>

    <script>
        const cfg = window.SnapNexus;
        const client = new Appwrite.Client().setEndpoint(cfg.ENDPOINT).setProject(cfg.PROJECT_ID);
        const account = new Appwrite.Account(client);
        const databases = new Appwrite.Databases(client);
        
        let isSignup = false;
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            const authForm = document.getElementById('authForm');
            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');

            async function loadHistory() {
                try {
                    historyList.innerHTML = '<p style="color: #94a3b8; text-align: center;">Loading events...</p>';
                    const res = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [
                        Appwrite.Query.equal('hostEmail', currentUser.email),
                        Appwrite.Query.orderDesc('$createdAt')
                    ]);
                    if(res.documents.length === 0) {
                        historyList.innerHTML = '<p style="color: #94a3b8; text-align: center; padding: 20px;">No events found. Create your first one above!</p>';
                        return;
                    }
                    historyList.innerHTML = '';
                    res.documents.forEach(doc => {
                        const div = document.createElement('div');
                        div.className = 'history-item';
                        div.innerHTML = `
                            <div>
                                <strong>${doc.eventName}</strong>
                                <span>${new Date(doc.$createdAt).toLocaleDateString()}</span>
                            </div>
                            <span class="badge">${doc.tier}</span>
                        `;
                        div.addEventListener('click', () => { window.location.href = `dashboard.html?event=${doc.eventId}`; });
                        historyList.appendChild(div);
                    });
                } catch(e) { historyList.innerHTML = '<p style="color: #ef4444; text-align: center;">Failed to load history.</p>'; }
            }

            async function checkSession() {
                try {
                    currentUser = await account.get();
                    authForm.style.display = 'none';
                    historySection.style.display = 'block';
                    document.getElementById('authTitle').innerText = `Welcome, ${currentUser.name || 'Host'}`;
                    document.getElementById('authSubtitle').innerText = 'Your event dashboard';
                    loadHistory();
                } catch(err) {
                    authForm.style.display = 'block';
                    historySection.style.display = 'none';
                }
            }

            document.getElementById('toggleAuth').addEventListener('click', () => {
                isSignup = !isSignup;
                document.getElementById('nameGroup').style.display = isSignup ? 'block' : 'none';
                document.getElementById('loginBtn').innerHTML = isSignup ? 'Create Account <i data-lucide="user-plus"></i>' : 'Sign In <i data-lucide="arrow-right"></i>';
                document.getElementById('toggleAuth').innerText = isSignup ? 'Back to Sign In' : "Don't have an account? Create one.";
                lucide.createIcons();
            });

            document.getElementById('loginBtn').addEventListener('click', async () => {
                const email = document.getElementById('emailInput').value;
                const password = document.getElementById('passwordInput').value;
                const name = document.getElementById('nameInput').value;
                if(!email || !password) return alert('Email and password required.');
                const btn = document.getElementById('loginBtn');
                btn.innerHTML = 'Processing...';
                try {
                    if (isSignup) {
                        await account.create(Appwrite.ID.unique(), email, password, name);
                        await account.createEmailPasswordSession(email, password);
                        await account.updatePrefs({ tier: 'starter' });
                    } else { await account.createEmailPasswordSession(email, password); }
                    window.location.reload();
                } catch(e) { alert('Error: ' + e.message); btn.innerHTML = 'Try Again'; }
            });

            document.getElementById('createNewEventBtn').addEventListener('click', async () => {
                const eventName = prompt('Enter Event Name for TV Wall:');
                if (!eventName) return;
                const realEventId = 'evt_' + Math.random().toString(36).substr(2, 9);
                let userTier = 'starter';
                try {
                    const prefs = await account.getPrefs();
                    if (prefs.tier) userTier = prefs.tier;
                } catch(e) {}
                try {
                    await databases.createDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, realEventId, {
                        eventName: eventName, eventId: realEventId, tier: userTier, hostEmail: currentUser.email, status: 'active', createdAtUnix: Date.now()
                    });
                    window.location.href = `dashboard.html?event=${realEventId}`;
                } catch(err) { alert('Failed to create event: ' + err.message); }
            });

            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await account.deleteSession('current');
                window.location.reload();
            });

            checkSession();
        });
    </script>
</body>
</html>
