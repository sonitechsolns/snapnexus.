<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>SnapNexus | Host Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Urbanist', sans-serif; background: #020617; color: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow-x: hidden; }
        
        /* Continuous Background Animation */
        .liquid-mesh { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3; background: radial-gradient(circle at 20% 30%, #020617, #1e3a8a 30%, #3b82f6 65%, #4f46e5); background-size: 200% 200%; animation: liquidShift 16s ease infinite alternate; }
        @keyframes liquidShift { 0% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } 100% { background-position: 0% 50%; } }
        
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 40px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); z-index: 10; }
        h1 { font-family: 'Syne', sans-serif; font-size: 2rem; margin-bottom: 8px; text-align: center; }
        p.subtitle { color: #94a3b8; text-align: center; margin-bottom: 32px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
        input { width: 100%; padding: 14px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; font-family: inherit; font-size: 1rem; transition: all 0.3s ease; }
        input:focus { outline: none; border-color: #3b82f6; background: rgba(15, 23, 42, 0.8); }
        .btn-primary { width: 100%; padding: 16px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        .btn-primary:hover:not(:disabled) { background: #2563eb; transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
        .toggle-text { text-align: center; margin-top: 24px; color: #94a3b8; cursor: pointer; font-weight: 600; transition: color 0.3s ease; }
        .toggle-text:hover { color: #ffffff; }
        .history-item { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); padding: 16px; border-radius: 12px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: space-between; align-items: center; }
        .history-item:hover { background: rgba(30, 41, 59, 0.8); border-color: #3b82f6; }
        .history-item strong { display: block; font-size: 1.1rem; margin-bottom: 4px; }
        .history-item span { font-size: 0.85rem; color: #94a3b8; }
        .badge { background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        #historySection { display: none; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .lucide-spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body>
    <div class="liquid-mesh"></div>
    <div class="glass-panel">
        <h1 id="authTitle">SnapNexus Host</h1>
        <p class="subtitle" id="authSubtitle">Sign in to manage your events</p>
        <div id="authForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="emailInput" placeholder="host@example.com">
            </div>
            <button class="btn-primary" id="loginBtn">Sign In <i data-lucide="arrow-right"></i></button>
        </div>
        <div id="verifyingSection" style="display: none; text-align: center;">
            <i data-lucide="loader-2" class="lucide-spin" style="width: 48px; height: 48px; color: #3b82f6; margin-bottom: 16px;"></i>
            <h3 style="font-family: 'Syne'; margin-bottom: 16px; font-size: 1.2rem;">Verifying your secure link...</h3>
        </div>
        <div id="historySection">
            <button class="btn-primary" id="createNewEventBtn" style="margin-bottom: 24px; background: #10b981;">
                <i data-lucide="plus-circle"></i> Create New Event
            </button>
            <h3 style="font-family: 'Syne'; margin-bottom: 16px; font-size: 1.2rem;">Previous Events</h3>
            <div id="historyList"></div>
            <p class="toggle-text" id="logoutBtn" style="color: #ef4444; margin-top: 30px;">Sign Out</p>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentUserPrefs = null;
        let globalEventHistory = [];

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            const authForm = document.getElementById('authForm');
            const verifyingSection = document.getElementById('verifyingSection');
            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');

            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('userId');
            const secret = urlParams.get('secret');

            if (userId && secret) {
                authForm.style.display = 'none';
                if (verifyingSection) verifyingSection.style.display = 'block';
                try {
                    await account.updateMagicURLSession(userId, secret);
                    window.history.replaceState({}, document.title, window.location.pathname);
                } catch (err) {
                    alert("Failed to verify secure link. It may have expired.");
                    window.history.replaceState({}, document.title, window.location.pathname);
                    window.location.reload();
                    return;
                }
            }

            async function loadHistory() {
                try {
                    historyList.innerHTML = '<p style="color: #94a3b8; text-align: center;"><i data-lucide="loader-2" class="lucide-spin"></i> Loading events...</p>';
                    lucide.createIcons();
                    const res = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [
                        Appwrite.Query.equal('hostEmail', currentUser.email),
                        Appwrite.Query.orderDesc('$createdAt')
                    ]);
                    
                    globalEventHistory = res.documents;
                    
                    if(res.documents.length === 0) {
                        historyList.innerHTML = '<p style="color: #94a3b8; text-align: center; padding: 20px;">No events found. Create your first one above!</p>';
                        return;
                    }
                    
                    historyList.innerHTML = '';
                    res.documents.forEach(doc => {
                        const div = document.createElement('div');
                        div.className = 'history-item';
                        const statusColor = doc.status === 'active' ? '#10b981' : '#ef4444'; 
                        const isVipUser = currentUserPrefs && currentUserPrefs.tier === 'vip';
                        const tierHtml = (!isVipUser) ? `<span class="badge" style="margin-bottom: 6px; display: inline-block;">${doc.tier}</span><br>` : '';

                        div.innerHTML = `
                            <div>
                                <strong>${doc.eventName}</strong>
                                <span>${new Date(doc.$createdAt).toLocaleDateString()}</span>
                            </div>
                            <div style="text-align: right;">
                                ${tierHtml}
                                <span style="font-size: 0.7rem; font-weight: 800; color: ${statusColor}; background: ${statusColor}20; padding: 3px 8px; border-radius: 6px; text-transform: uppercase;">
                                    ${doc.status}
                                </span>
                            </div>
                        `;
                        div.addEventListener('click', () => { 
                            if (isVipUser) {
                                window.location.href = cfg.resolveUrl(`vip_dashboard.html?event=${doc.eventId}`);
                            } else {
                                window.location.href = cfg.resolveUrl(`dashboard.html?event=${doc.eventId}`); 
                            }
                        });
                        historyList.appendChild(div);
                    });
                } catch(e) { historyList.innerHTML = '<p style="color: #ef4444; text-align: center;">Failed to load history.</p>'; }
            }

            async function checkSession() {
                try {
                    currentUser = await account.get();
                    
                    // 5. VIP Subscription Engine - Timer & Tier handling
                    let prefs = await account.getPrefs();
                    currentUserPrefs = prefs;
                    if (prefs.subExpiry) {
                        const now = Date.now();
                        const bufferMs = 3 * 3600000; // 3 hours
                        
                        try {
                            if (prefs.tier === 'pro' || prefs.tier === 'premium') {
                                if (now > prefs.subExpiry) {
                                    const activeReq = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [
                                        Appwrite.Query.equal('hostEmail', currentUser.email),
                                        Appwrite.Query.equal('status', 'active')
                                    ]);
                                    for (let doc of activeReq.documents) {
                                        await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, doc.$id, { status: 'ended' });
                                    }
                                }
                                if (now > prefs.subExpiry + bufferMs) {
                                    const proReq = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [
                                        Appwrite.Query.equal('hostEmail', currentUser.email),
                                        Appwrite.Query.notEqual('tier', 'starter')
                                    ]);
                                    for (let doc of proReq.documents) {
                                        await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, doc.$id, { tier: 'starter' });
                                    }
                                    await account.updatePrefs({ tier: 'starter', subExpiry: null });
                                    prefs.tier = 'starter';
                                }
                            } else if (prefs.tier === 'vip') {
                                if (now > prefs.subExpiry) {
                                    const vipReq = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [
                                        Appwrite.Query.equal('hostEmail', currentUser.email),
                                        Appwrite.Query.equal('tier', 'vip')
                                    ]);
                                    for (let doc of vipReq.documents) {
                                        await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, doc.$id, { tier: 'starter' });
                                    }
                                    await account.updatePrefs({ tier: 'starter', subExpiry: null });
                                    prefs.tier = 'starter';
                                }
                            }
                        } catch(e) { console.error('Subscription expiry update failed', e); }
                    }

                    authForm.style.display = 'none';
                    if (verifyingSection) verifyingSection.style.display = 'none';
                    historySection.style.display = 'block';
                    if (currentUserPrefs && currentUserPrefs.tier === 'vip') {
                        document.getElementById('authTitle').innerHTML = `<i data-lucide="crown" style="color: #fbbf24; vertical-align: middle;"></i> Welcome, ${currentUser.name || 'VIP Host'}`;
                        document.getElementById('authTitle').style.color = '#fbbf24';
                        document.getElementById('authSubtitle').innerText = 'VIP Command Center';
                    } else {
                        document.getElementById('authTitle').innerText = `Welcome, ${currentUser.name || 'Host'}`;
                        document.getElementById('authSubtitle').innerText = 'Your event dashboard';
                    }
                    loadHistory();

                    const urlParams = new URLSearchParams(window.location.search);

                    const planMap = {
                        'pro': { amount: 499, name: 'Pro Plan' },
                        'premium': { amount: 999, name: 'Premium Plan' },
                        'vip': { amount: 2999, name: 'VIP Plan' }
                    };
                    
                    const p = urlParams.get('plan');
                    if (p && planMap[p]) {
                        if (!confirm("By proceeding with this payment, you agree to our Privacy Policy and Terms of Service.")) {
                            window.history.replaceState({}, document.title, 'login.html');
                            return;
                        }
                        const planDetails = planMap[p];

                        const options = {
                            key: window.cfg.RAZORPAY_KEY,
                            amount: planDetails.amount * 100,
                            currency: 'INR', 
                            name: 'SnapNexus', 
                            description: `Upgrade to ${planDetails.name}`,
                            handler: async function (response) {
                                const subExpiry = Date.now() + 30 * 24 * 60 * 60 * 1000;
                                await account.updatePrefs({ tier: p, subExpiry: subExpiry });
                                
                                try {
                                    const res = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [
                                        Appwrite.Query.equal('hostEmail', currentUser.email),
                                        Appwrite.Query.equal('status', 'active')
                                    ]);
                                    for (let doc of res.documents) {
                                        await databases.updateDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, doc.$id, { tier: p });
                                    }
                                } catch(e) { console.error('Failed to sync events', e); }
                                
                                const txnId = response.razorpay_payment_id || "TXN_" + Math.random().toString(36).substr(2,9).toUpperCase();
                                
                                const { jsPDF } = window.jspdf;
                                const doc = new jsPDF();
                                doc.setFont("Helvetica", "bold");
                                doc.text("SnapNexus Digital Receipt", 20, 20);
                                doc.setFont("Helvetica", "normal");
                                doc.text(`Transaction ID: ${txnId}`, 20, 30);
                                doc.text(`Plan Name: ${planDetails.name}`, 20, 40);
                                doc.text(`Amount: INR ${planDetails.amount}`, 20, 50);
                                doc.text(`Date: ${new Date().toLocaleDateString()}`, 20, 60);
                                doc.save('SnapNexus_Receipt_' + txnId + '.pdf');

                                alert(`Payment Successful! Your digital receipt has been downloaded. Welcome to the ${planDetails.name}.`);
                                window.location.href = 'login.html'; // Refresh without params
                            },
                            modal: {
                                ondismiss: function() {
                                    window.history.replaceState({}, document.title, 'login.html');
                                }
                            }
                        };
                        new window.Razorpay(options).open();
                    } else if (p) {
                        window.history.replaceState({}, document.title, 'login.html');
                    }
                } catch(err) {
                    if (verifyingSection) verifyingSection.style.display = 'none';
                    authForm.style.display = 'block';
                    historySection.style.display = 'none';
                }
            }

            document.getElementById('loginBtn').addEventListener('click', async () => {
                const email = document.getElementById('emailInput').value;
                if(!email) return alert('Email required.');
                const btn = document.getElementById('loginBtn');
                btn.disabled = true;
                btn.innerHTML = '<i data-lucide="loader-2" class="lucide-spin"></i> Sending Link...';
                lucide.createIcons();
                try {
                    await account.createMagicURLToken(Appwrite.ID.unique(), email, window.location.origin + window.location.pathname);
                    btn.innerHTML = 'Check your email!';
                    alert('A secure login link has been sent to your email.');
                } catch(e) { 
                    alert('Error: ' + e.message); 
                    btn.disabled = false;
                    btn.innerHTML = 'Sign In <i data-lucide="arrow-right"></i>';
                    lucide.createIcons();
                }
            });

            document.getElementById('createNewEventBtn').addEventListener('click', async () => {
                const btn = document.getElementById('createNewEventBtn');
                btn.disabled = true;
                const oldHtml = btn.innerHTML;
                btn.innerHTML = '<i data-lucide="loader-2" class="lucide-spin"></i> Creating...';
                lucide.createIcons();
                
                let userTier = 'starter';
                try {
                    const prefs = await account.getPrefs();
                    if (prefs.tier) userTier = prefs.tier;
                } catch(e) {}

                const activeCount = globalEventHistory.filter(e => e.status === 'active').length;
                let limit = 1;
                if (userTier === 'premium') limit = 5;
                if (userTier === 'vip') limit = Infinity;

                if (activeCount >= limit) {
                    alert(`Limit Reached: Your current plan allows only ${limit} active event(s) at a time.\\n\\nPlease click your active event below and press "End Event", or upgrade for more capacity.`);
                    btn.disabled = false;
                    btn.innerHTML = oldHtml;
                    return;
                }

                const eventName = prompt('Enter Event Name for TV Wall:');
                if (!eventName) {
                    btn.disabled = false;
                    btn.innerHTML = oldHtml;
                    return;
                }
                
                const realEventId = 'evt_' + Math.random().toString(36).substr(2, 9);
                
                try {
                    await databases.createDocument(cfg.DATABASE_ID, cfg.COLLECTION_ID, realEventId, {
                        eventName: eventName, 
                        eventId: realEventId, 
                        tier: userTier, 
                        hostEmail: currentUser.email, 
                        status: 'active'
                    });
                    // Redirect according to tier
                    if (userTier === 'vip') {
                         window.location.href = `vip_dashboard.html?event=${realEventId}`;
                    } else {
                         window.location.href = `dashboard.html?event=${realEventId}`;
                    }
                } catch(err) { 
                    alert('Failed to create event: ' + err.message); 
                    btn.disabled = false;
                    btn.innerHTML = oldHtml;
                }
            });

            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await account.deleteSession('current');
                window.location.reload();
            });

            checkSession();
        });
    </script>
</body>
</html>
