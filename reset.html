<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b18">
<meta name="robots" content="noindex">
<title>Set a new password · SnapNexus</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* SnapNexus design system — shared by every page.
   Brand colours come from the current logo (amber wordmark on deep blue).
   To re-brand later, change the tokens in :root only. Guest/TV pages override
   the same tokens from the event's theme at runtime. */
:root{
  --bg:#050b18; --bg-2:#081328; --bg-3:#0c1a36;
  --surface:rgba(16,30,60,.52); --surface-solid:#0d1a33; --surface-hi:rgba(28,48,92,.6);
  --line:rgba(150,180,255,.10); --line-2:rgba(150,180,255,.20);
  --text:#f2f5fb; --muted:#9dabc6; --dim:#6a7894;
  --accent:#f5b301; --accent-2:#ffd34d; --accent-rgb:245,179,1; --on-accent:#1b1303;
  --blue:#2f6fe4; --blue-rgb:47,111,228;
  --ok:#10b981; --warn:#f59e0b; --danger:#f43f5e;
  --radius:22px; --radius-sm:14px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --head:'Syne','Inter',sans-serif;
  --shadow:0 24px 70px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.sn-bg{background:
  radial-gradient(900px 600px at 12% -10%,rgba(var(--blue-rgb),.28),transparent 60%),
  radial-gradient(700px 500px at 100% 0%,rgba(var(--blue-rgb),.16),transparent 60%),
  radial-gradient(800px 500px at 50% 120%,rgba(var(--accent-rgb),.07),transparent 60%),
  var(--bg);background-attachment:fixed}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--head);line-height:1.1;letter-spacing:-.02em;margin:0}
p{margin:0}
.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 20px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.accent{color:var(--accent)}
.row{display:flex;align-items:center;gap:12px}
.row.wrap-ok{flex-wrap:wrap}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}

/* logo */
.logo{display:inline-flex;align-items:center}
.logo img{height:22px;width:auto}
.logo.lg img{height:30px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:600;font-size:.95rem;border:1px solid transparent;background:none;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s,opacity .2s;white-space:nowrap;text-align:center;line-height:1.2}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--on-accent);box-shadow:0 0 24px rgba(var(--accent-rgb),.22)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(var(--accent-rgb),.38)}
.btn-ghost{background:rgba(255,255,255,.04);border-color:var(--line-2);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{filter:brightness(1.1)}
.btn-danger{background:rgba(244,63,94,.1);border-color:rgba(244,63,94,.35);color:#fda4b4}
.btn-danger:hover{background:rgba(244,63,94,.18)}
.btn-sm{padding:8px 14px;font-size:.85rem}
.btn-lg{padding:16px 28px;font-size:1.05rem}
.btn-block{width:100%}
.btn-icon{width:40px;height:40px;padding:0;border-radius:12px}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card-pad{padding:24px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-family:var(--head);font-size:1.15rem;font-weight:700}
.card-h .i{color:var(--accent)}
.card-sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}

/* forms */
.field{display:flex;flex-direction:column;gap:7px}
.label{font-size:.85rem;font-weight:600;color:var(--muted)}
.input,.select,.textarea{width:100%;background:rgba(3,8,20,.55);border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:13px 15px;outline:none;transition:border-color .2s,box-shadow .2s;color:var(--text)}
.input::placeholder{color:var(--dim)}
.input:focus,.select:focus,.textarea:focus{border-color:rgba(var(--accent-rgb),.7);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.14)}
.select{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
.select option{background:var(--surface-solid)}
.input-wrap{position:relative}
.input-wrap .btn-icon{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;color:var(--muted)}
input[type=color]{-webkit-appearance:none;appearance:none;border:0;width:34px;height:34px;padding:0;border-radius:50%;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:2px solid rgba(255,255,255,.3);border-radius:50%}
input[type=color]::-moz-color-swatch{border:2px solid rgba(255,255,255,.3);border-radius:50%}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--muted);background:rgba(255,255,255,.03);white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.live{color:#34d399;border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.08)}
.badge.ended{color:#fb7185;border-color:rgba(244,63,94,.35);background:rgba(244,63,94,.08)}
.badge.trial{color:#93c5fd;border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.08)}
.badge.single{color:var(--accent-2);border-color:rgba(var(--accent-rgb),.4);background:rgba(var(--accent-rgb),.08)}
.badge.pro{color:var(--on-accent);border-color:transparent;background:linear-gradient(180deg,var(--accent-2),var(--accent))}
.badge.warn{color:#fcd34d;border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08)}
.badge.pulse .dot{animation:snPulse 1.6s infinite}
@keyframes snPulse{50%{opacity:.3}}

/* top bar (host pages) */
.topbar{position:sticky;top:0;z-index:40;background:rgba(5,11,24,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar .wrap{height:64px;display:flex;align-items:center;gap:14px}
.topbar .who{font-size:.85rem;color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:600px){.topbar .who{display:none}}

/* segmented control */
.seg{display:flex;padding:4px;border-radius:999px;background:rgba(0,0,0,.25);background:color-mix(in srgb,var(--text) 6%,transparent);border:1px solid var(--line-2);position:relative}
.seg button{flex:1;white-space:nowrap;border:0;background:none;padding:10px 14px;border-radius:999px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:7px;position:relative;z-index:1;transition:color .2s}
.seg button[aria-pressed=true]{color:var(--on-accent);background:var(--accent)}

/* toasts */
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;padding:13px 16px;border-radius:14px;background:rgba(10,20,40,.94);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:.92rem;font-weight:500;color:#fff;opacity:0;transform:translateY(-10px);transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:none}
.toast .i{margin-top:1px}
.toast.ok .i{color:#34d399} .toast.err .i{color:#fb7185} .toast.info .i{color:#93c5fd}

/* modal */
.modal{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,5,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.modal-box{width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid);border:1px solid var(--line-2);border-radius:24px;padding:26px;box-shadow:var(--shadow);transform:translateY(12px) scale(.98);transition:transform .25s}
.modal.open .modal-box{transform:none}
.modal-box.wide{max-width:640px}
.modal-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.modal-head h3{font-size:1.35rem;flex:1}
.modal-head .btn-icon{margin:-8px -8px 0 0;color:var(--muted)}

/* misc */
.spin{animation:snSpin 1s linear infinite}
@keyframes snSpin{to{transform:rotate(360deg)}}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:.95rem}
.empty .i{width:32px;height:32px;color:var(--dim);margin:0 auto 10px;display:block}
.skel{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:snSkel 1.2s infinite}
@keyframes snSkel{to{background-position:-200% 0}}
.divider{height:1px;background:var(--line);margin:18px 0}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em;background:rgba(255,255,255,.06);border:1px solid var(--line-2);padding:2px 7px;border-radius:7px}
.notice{display:flex;gap:10px;padding:13px 15px;border-radius:14px;font-size:.9rem;border:1px solid var(--line-2);background:rgba(255,255,255,.03)}
.notice .i{flex:none;margin-top:2px}
.notice.warn{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.07);color:#fde68a}
.notice.err{border-color:rgba(244,63,94,.35);background:rgba(244,63,94,.07);color:#fecdd3}
.notice.ok{border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.07);color:#a7f3d0}
.notice.info{border-color:rgba(var(--blue-rgb),.4);background:rgba(var(--blue-rgb),.08);color:#bfdbfe}
.mock-flag{position:fixed;left:12px;bottom:12px;z-index:2000;background:#f43f5e;color:#fff;font-size:.7rem;font-weight:800;letter-spacing:.1em;padding:5px 10px;border-radius:99px;text-transform:uppercase;opacity:.9;text-decoration:none}
.foot-mini{padding:28px 0 36px;color:var(--dim);font-size:.82rem;text-align:center}
.foot-mini a{color:var(--muted)} .foot-mini a:hover{color:#fff}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

</style>

<script>
window.SN_INLINE_ICONS = true;
/* SnapNexus core — shared by every page.
   - SN.api   : all data access (Appwrite, or an in-browser mock for testing)
   - SN.theme : event themes (4 presets + custom colours/font)
   - SN.plans : tiers, free-trial timing, limits
   - SN.ui    : toasts, modals, QR codes, icons, escaping
   Test mode: add ?mock=1 to any URL (remembered in this browser until ?mock=0). Data lives in
   localStorage only and never touches Appwrite. Remove with ?mock=0.
   Requires config.js to be loaded first. */
(function () {
  'use strict';
  var cfg = window.SnapNexus;
  var SN = window.SN = { cfg: cfg };

  /* ------------------------------------------------------------------ utils */
  SN.$ = function (s, r) { return (r || document).querySelector(s); };
  SN.$$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  SN.esc = function (v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  SN.qs = function (k) { return new URLSearchParams(location.search).get(k); };
  SN.rand = function (n) { var s = ''; while (s.length < n) s += Math.random().toString(36).slice(2); return s.slice(0, n); };
  SN.sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  SN.icon = function (name, cls) { return '<svg class="i' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="' + (window.SN_INLINE_ICONS ? '' : SN.assetBase + 'icons.svg') + '#' + name + '"/></svg>'; };
  SN.fmtDate = function (iso) { try { return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; } };
  SN.fmtDateTime = function (iso) { try { return new Date(iso).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } };
  SN.fmtLeft = function (ms) {
    if (ms <= 0) return '0m';
    var m = Math.ceil(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (d >= 1) return d + 'd ' + (h % 24) + 'h';
    if (h >= 1) return h + 'h ' + (m % 60) + 'm';
    return m + 'm';
  };
  SN.isVideoUrl = function (u) { u = u || ''; return /^data:video\//.test(u) || /\.(mp4|mov|webm)(\?|&|$)/i.test(u) || /[?&]sn_kind=video/.test(u); };

  // Analytics (PostHog). Safe no-op when PostHog is blocked or in test mode.
  SN.track = function (event, props) { try { if (window.posthog && window.posthog.capture) window.posthog.capture(event, props || {}); } catch (e) { } };
  SN.identify = function (user, props) { try { if (window.posthog && window.posthog.identify && user) window.posthog.identify(user.$id, props || {}); } catch (e) { } };
  SN.resetAnalytics = function () { try { if (window.posthog && window.posthog.reset) window.posthog.reset(); } catch (e) { } };
  // Human-readable error text for Appwrite errors
  SN.errMsg = function (e) {
    var m = (e && e.message) || String(e || 'Something went wrong');
    var code = e && (e.code || 0), type = (e && e.type) || '';
    if (code === 401 && /unauthorized|not authorized|missing scope/i.test(m + type)) return 'The server didn\'t allow this action. Your Appwrite permissions need updating (see setup/README.md).';
    if (/Failed to fetch|NetworkError|network/i.test(m)) return 'Can\'t reach the server. Check your connection and try again.';
    if (/storage_file_type_unsupported|extension/i.test(m + type)) return 'That file type isn\'t allowed.';
    if (/storage_invalid_file_size|file size/i.test(m + type)) return 'That file is too big.';
    return m;
  };

  // where assets live, relative to the current page (supports sub-folder hosting)
  (function () {
    var me = document.currentScript && document.currentScript.getAttribute('src') || 'assets/sn.js';
    SN.assetBase = me.replace(/sn\.js(\?.*)?$/, '');
  })();

  /* ------------------------------------------------------------ mock switch */
  (function () {
    var q = SN.qs('mock');
    try {
      if (q === '1') localStorage.setItem('sn_mock', '1');
      if (q === '0') localStorage.removeItem('sn_mock');
      SN.mock = localStorage.getItem('sn_mock') === '1' || location.protocol === 'file:';
    } catch (e) { SN.mock = q === '1' || location.protocol === 'file:'; }
  })();
  // keep ?mock=1 on internal links while testing
  SN.link = function (path) { return path; };

  /* -------------------------------------------------------------- plans */
  var P = SN.plans = {};
  P.norm = function (t) {
    t = String(t || 'starter').toLowerCase();
    if (cfg.LEGACY_TIERS && cfg.LEGACY_TIERS[t]) t = cfg.LEGACY_TIERS[t];
    if (t === 'unpaid' || cfg.PLANS[t]) return t;
    return 'starter';
  };
  P.info = function (t) { return cfg.PLANS[P.norm(t)] || { name: 'Awaiting payment', price: cfg.PLANS.single.price, ads: true }; };
  P.label = function (t) { t = P.norm(t); return t === 'unpaid' ? 'Awaiting payment' : cfg.PLANS[t].name; };
  P.badgeClass = function (t) { t = P.norm(t); return { starter: 'trial', single: 'single', pro: 'pro', unpaid: 'warn' }[t]; };
  P.hasAds = function (ev) { var t = P.norm(ev && ev.tier); return t === 'starter' || t === 'unpaid'; };
  P.trialEndsAt = function (ev) {
    if (P.norm(ev.tier) !== 'starter') return null;
    return new Date(ev.$createdAt).getTime() + (cfg.PLANS.starter.trialMinutes || 60) * 60000;
  };
  // Can guests upload / does the wall run right now?
  P.wallState = function (ev) {
    if (!ev) return 'missing';
    if (ev.status === 'ended') return 'ended';
    var t = P.norm(ev.tier);
    if (t === 'unpaid') return 'unpaid';
    if (t === 'starter' && Date.now() > P.trialEndsAt(ev)) return 'trial_over';
    return 'live';
  };
  P.downloadUntil = function (ev) {
    var t = P.norm(ev.tier), created = new Date(ev.$createdAt).getTime();
    if (t === 'starter') return P.trialEndsAt(ev) + (cfg.PLANS.starter.downloadHours || 24) * 3600000;

    return created + (cfg.PLANS[t].downloadDays || 30) * 86400000;
  };

    { key: 'Playfair Display', css: "'Playfair Display', serif", label: 'Playfair · classic wedding' },
    { key: 'Syne', css: "'Syne', sans-serif", label: 'Syne · bold & edgy' },
    { key: 'Space Grotesk', css: "'Space Grotesk', sans-serif", label: 'Space Grotesk · corporate' },

    { key: 'Urbanist', css: "'Urbanist', sans-serif", label: 'Urbanist · friendly' },

  ];
  T.PRESETS = {
    default:   { label: 'SnapNexus', bg: '#061022', accent: '#f5b301', head: 2, body: 0, glow: '#2f6fe4' },
    wedding:   { label: 'Wedding',   bg: '#fdf6f2', accent: '#b8894a', head: 1, body: 6, glow: '#f6c9d0' },
    corporate: { label: 'Corporate', bg: '#050506', accent: '#ffc83d', head: 0, body: 0, glow: '#ff7a1a' },
    party:     { label: 'Party',     bg: '#0a0216', accent: '#ff2e9a', head: 5, body: 5, glow: '#00f0ff' }
  };
  T.hexToRgb = function (hex) {

      while (out.length < max) {
        var r = await list(coll, queries.concat([Q.limit(page), Q.offset(offset)]));
        out = out.concat(r.documents);
        if (r.documents.length < page) break;
        offset += page;
      }

      Q: Q,

      signOut: function () { return account.deleteSession('current'); },

      hostDocs: function (email) { return listAll(C.COLLECTION_ID, [Q.equal('hostEmail', email)], 500); },

    function now() { return new Date().toISOString(); }
    function id() { return SN.rand(20); }
    function delay(v) { return SN.sleep(120).then(function () { return JSON.parse(JSON.stringify(v)); }); }
    function err(m) { var e = new Error(m); return Promise.reject(e); }
    function sortDesc(a) { return a.sort(function (x, y) { return new Date(y.$createdAt) - new Date(x.$createdAt); }); }
    return {
      mock: true,
      me: function () { fresh(); var u = d.users.find(function (u) { return u.email === d.session; }); return delay(u ? { $id: u.$id, name: u.name, email: u.email } : null); },
      prefs: function () { fresh(); var u = d.users.find(function (u) { return u.email === d.session; }); return delay(u ? u.prefs : {}); },
      setPrefs: function (p) { fresh(); var u = d.users.find(function (u) { return u.email === d.session; }); if (!u) return err('Not signed in'); u.prefs = p; save(d); return delay(p); },
      signIn: function (e, p) { fresh(); var u = d.users.find(function (u) { return u.email === e.toLowerCase(); }); if (!u || u.pw !== p) return err('Invalid credentials. Please check the email and password.'); d.session = u.email; save(d); return delay({}); },
      signUp: function (n, e, p) { fresh(); e = e.toLowerCase(); if (d.users.some(function (u) { return u.email === e; })) return err('A user with the same email already exists.'); if (String(p).length < 8) return err('Password must be at least 8 characters.'); d.users.push({ $id: id(), name: n, email: e, pw: p, prefs: { tier: 'starter' } }); d.session = e; save(d); return delay({}); },
      signOut: function () { fresh(); d.session = null; save(d); return delay({}); },
      recover: function (email) { fresh(); var u = d.users.find(function (u) { return u.email === String(email).toLowerCase(); }); if (u) { u.recovery = 'mocksecret'; save(d); console.info('[test mode] reset link: reset.html?userId=' + u.$id + '&secret=mocksecret'); } return delay({}); },
      resetPassword: function (uid, secret, pw) { fresh(); var u = d.users.find(function (u) { return u.$id === uid; }); if (!u || u.recovery !== secret) return err('Invalid or expired reset link.'); if (String(pw).length < 8) return err('Password must be at least 8 characters.'); u.pw = pw; delete u.recovery; save(d); return delay({}); },
      getEvent: function (eventId) { fresh(); return delay(d.events.find(function (x) { return x.eventId === eventId; }) || null); },
      hostDocs: function (email) { fresh(); return delay(d.events.filter(function (x) { return x.hostEmail === email; })); },
      eventsByStatus: function (status, since) { fresh(); var r = d.events.filter(function (x) { return x.status === status && (!since || x.$createdAt >= since); }); return delay({ total: r.length, documents: r }); },
      createDoc: function (docId, data) { fresh(); var me = d.users.find(function (u) { return u.email === d.session; }); var doc = Object.assign({ $id: docId || id(), $createdAt: now(), $updatedAt: now(), $permissions: me ? ['read("user:' + me.$id + '")', 'update("user:' + me.$id + '")', 'delete("user:' + me.$id + '")'] : [] }, data); d.events.push(doc); save(d); return delay(doc); },
      updateEvent: function (docId, data) { fresh(); var x = d.events.find(function (e) { return e.$id === docId; }); if (!x) return err('Document not found'); Object.assign(x, data, { $updatedAt: now() }); save(d); return delay(x); },
      uploads: function (eventId, opt) {
        opt = opt || {}; fresh();
        var r = d.uploads.filter(function (u) { return u.event_id === eventId && (opt.groupId ? u.group_id === opt.groupId : opt.publicOnly ? !u.group_id : true); });
        r = sortDesc(r); if (opt.limit) r = r.slice(0, opt.limit);
        return delay(r);
      },
      putFile: function (file, fid) {
        return new Promise(function (res, rej) {
          var fr = new FileReader();
          fr.onload = function () { fresh(); fid = fid || id(); d.files[fid] = fr.result; try { save(d); } catch (e) { delete d.files[fid]; return rej(e); } res({ id: fid, url: fr.result }); };
          fr.onerror = function () { rej(new Error('Could not read file')); };
          fr.readAsDataURL(file);
        });
      },
      delFile: function (fid) { fresh(); delete d.files[fid]; save(d); return delay({}); },
      fileUrl: function (fid) { fresh(); return d.files[fid] || ''; },
      createUploadDoc: function (data) { fresh(); var doc = Object.assign({ $id: id(), $createdAt: now(), is_pinned: false }, data); d.uploads.push(doc); save(d); return delay(doc); },
      updateUpload: function (uid, data) { fresh(); var x = d.uploads.find(function (u) { return u.$id === uid; }); if (!x) return err('Document not found'); Object.assign(x, data); save(d); return delay(x); },
      deleteUploadDoc: function (uid) { fresh(); d.uploads = d.uploads.filter(function (u) { return u.$id !== uid; }); save(d); return delay({}); },
      groups: function (eventId) { fresh(); return delay(d.groups.filter(function (g) { return g.event_id === eventId; })); },
      findGroup: function (eventId, name) { fresh(); return delay(d.groups.find(function (g) { return g.event_id === eventId && g.group_name === name; }) || null); },
      createGroup: function (data) { fresh(); var doc = Object.assign({ $id: id(), $createdAt: now() }, data); d.groups.push(doc); save(d); return delay(doc); },
      ID: function () { return id(); },
      _db: function () { return fresh(); },
      _reset: function () { localStorage.removeItem(KEY); }
    };
  }

  var B = null;
  A.ready = function () {
    if (B) return B;
    B = SN.mock ? Mock() : Real();
    return B;
  };
  function be() { return A.ready(); }

  /* ---------- high-level operations used by the pages ---------- */
  var REAL_STATUSES = ['active', 'ended'];
  A.me = function () { return be().me(); };
  A.prefs = function () { return be().prefs(); };
  A.signIn = function (e, p) { return be().signIn(e, p); };
  A.signUp = function (n, e, p) { return be().signUp(n, e, p); };
  A.signOut = function () { return be().signOut(); };
  A.recover = function (email) { return be().recover(email, C.resolveUrl('reset.html')); };
  A.resetPassword = function (uid, secret, pw) { return be().resetPassword(uid, secret, pw); };
  A.isAdmin = function (user) { return !!user && (C.ADMIN_EMAILS || []).map(function (x) { return x.toLowerCase(); }).indexOf(String(user.email).toLowerCase()) !== -1; };

  A.getEvent = function (eventId) { return be().getEvent(eventId); };
  A.updateEvent = function (docId, data) { return be().updateEvent(docId, data); };

  // All of a host's docs, split into real events and billing records
  A.hostData = async function (email) {
    var docs = await be().hostDocs(email);
    var events = docs.filter(function (x) { return REAL_STATUSES.indexOf(x.status) !== -1; })
      .sort(function (a, b) { return new Date(b.$createdAt) - new Date(a.$createdAt); });
    var subs = docs.filter(function (x) { return x.status === 'subscription'; });
    var pays = docs.filter(function (x) { return String(x.status).indexOf('payment') === 0; });
    return { events: events, subs: subs, payments: pays };
  };
  // Subscription records: Events docs with status 'subscription', eventName 'until|<ms>'
  A.proUntil = function (subs, prefs) {
    var best = 0;
    var admins = C.ADMIN_USER_IDS || [];
    (subs || []).forEach(function (s) {
      if (admins.length && !(s.$permissions || []).some(function (p) { return admins.some(function (id) { return p.indexOf('user:' + id) !== -1; }); })) return; // not granted by an admin
      var m = /^until\|(\d+)/.exec(s.eventName || ''); if (m) best = Math.max(best, +m[1]);
    });
    // Note: plans in account prefs from the old site are NOT trusted (anyone can edit their own prefs).
    return best;
  };
  A.createEvent = function (data) {
    var eid = 'evt_' + SN.rand(9);
    return be().createDoc(eid, { eventId: eid, eventName: data.eventName, tier: data.tier, hostEmail: data.hostEmail, status: 'active', theme: data.theme || 'default' });
  };
  A.endEvent = function (ev) { return be().updateEvent(ev.$id, { status: 'ended' }); };

  // Payment requests: Events docs with status 'payment_pending' | 'payment_done' | 'payment_rejected'
  // eventName = 'plan|amount|utr|targetEventId'
  A.requestPayment = function (o) {
    var pid = 'pay_' + SN.rand(9);
    return be().createDoc(pid, { eventId: pid, status: 'payment_pending', tier: o.plan, hostEmail: o.hostEmail, eventName: [o.plan, o.amount, String(o.utr).trim(), o.targetEventId || '-', o.ref || ''].join('|') });
  };
  A.parsePayment = function (doc) {
    var p = String(doc.eventName || '').split('|');
    return { doc: doc, plan: p[0], amount: +p[1] || 0, utr: p[2] || '', target: p[3] && p[3] !== '-' ? p[3] : null, ref: p[4] || '', status: String(doc.status).replace('payment_', ''), email: doc.hostEmail, at: doc.$createdAt };
  };
  A.payments = async function () {
    var out = [];
    for (var s of ['payment_pending', 'payment_done', 'payment_rejected']) { var r = await be().eventsByStatus(s); out = out.concat(r.documents); }
    return out.map(A.parsePayment).sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
  };
  A.setPaymentStatus = function (doc, status) { return be().updateEvent(doc.$id, { status: 'payment_' + status }); };
  A.grantPro = async function (email, days) {
    var docs = await be().hostDocs(email);
    var subs = docs.filter(function (x) { return x.status === 'subscription'; });
    var cur = A.proUntil(subs), from = Math.max(Date.now(), cur), until = from + days * 86400000;
    if (subs.length) await be().updateEvent(subs[0].$id, { eventName: 'until|' + until });
    else { var sid = 'sub_' + SN.rand(9); await be().createDoc(sid, { eventId: sid, status: 'subscription', tier: 'pro', hostEmail: email, eventName: 'until|' + until }); }
    return until;
  };
  A.eventsByStatus = function (status, since, lim) { return be().eventsByStatus(status, since, lim); };
  A.logVisit = function (email) {
    try {
      if (sessionStorage.getItem('visited')) return;
      var vid = 'visit_' + Date.now();
      be().createDoc(vid, { eventId: vid, status: 'visit', eventName: 'Page Visit', hostEmail: email || 'anonymous', tier: 'none' })
        .then(function () { sessionStorage.setItem('visited', 'true'); }).catch(function () { });
    } catch (e) { }
  };

  // Uploads
  A.isPublic = function (u) { return !u.group_id && u.is_public_wall_allowed !== false && u.is_public_wall_allowed !== 'false'; };
  A.uploads = function (eventId, opt) { return be().uploads(eventId, opt); };
  A.addUpload = async function (o) {
    // o: { eventId, blob, name, mime, kind, groupId }
    var safe = o.eventId + '_' + Date.now() + '_' + SN.rand(4) + '_' + String(o.name || 'file').replace(/[^a-zA-Z0-9.]/g, '').slice(-40);
    var file = new File([o.blob], safe, { type: o.mime || o.blob.type || 'application/octet-stream' });
    var f = await be().putFile(file);
    var fileUrl = f.url + (o.kind === 'video' && f.url.indexOf('data:') !== 0 ? (f.url.indexOf('?') === -1 ? '?' : '&') + 'sn_kind=video' : '');
    var payload = { file_id: f.id, event_id: o.eventId, file_url: fileUrl, is_public_wall_allowed: !o.groupId };
    if (o.groupId) payload.group_id = String(o.groupId);
    try { return await be().createUploadDoc(payload); }
    catch (e) { try { await be().delFile(f.id); } catch (x) { } throw e; }
  };
  A.removeUpload = async function (u) {
    await be().deleteUploadDoc(u.$id);
    if (u.file_id) { try { await be().delFile(u.file_id); } catch (e) { } }
  };
  A.updateUpload = function (id, data) { return be().updateUpload(id, data); };

  // Groups (passcodes are stored hashed)
  A.hash = async function (s) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  };
  A.groups = function (eventId) { return be().groups(eventId); };
  A.joinGroup = async function (eventId, name, pass) {
    var h = await A.hash(pass), g = await be().findGroup(eventId, name);
    if (g) { if (g.passcode !== h) throw new Error('Wrong passcode for this group.'); return { group: g, created: false }; }
    g = await be().createGroup({ event_id: eventId, group_name: name, passcode: h, created_by_token: 'anonymous_' + SN.rand(9) });
    return { group: g, created: true };
  };

  // Files / ads (ads live in storage as global_ad_1..3, as on the previous site)
  A.putFile = function (file, id) { return be().putFile(file, id); };
  A.delFile = function (id) { return be().delFile(id); };
  A.fileUrl = function (id) { return be().fileUrl(id); };
  A.logoId = function (eventId) { return ('logo_' + eventId).slice(0, 36); };
  A.logoUrl = function (ev) {
    if (ev && ev.customWatermark) return ev.customWatermark;
    if (SN.mock) return be().fileUrl(A.logoId(ev.eventId)) || '';
    return C.ENDPOINT + '/storage/buckets/' + C.BUCKET_ID + '/files/' + A.logoId(ev.eventId) + '/view?project=' + C.PROJECT_ID;
  };
  A.setLogo = async function (ev, file) {
    var fid = A.logoId(ev.eventId);
    try { await be().delFile(fid); } catch (e) { }
    await be().putFile(file, fid);
  };
  A.removeLogo = async function (ev) { await be().delFile(A.logoId(ev.eventId)); };
  A.adUrl = function (slot) {
    if (SN.mock) return be().fileUrl('global_ad_' + slot) || '';
    return C.ENDPOINT + '/storage/buckets/' + C.BUCKET_ID + '/files/global_ad_' + slot + '/view?project=' + C.PROJECT_ID;
  };

  // Mock-only: seed a realistic demo account so every page can be tried end-to-end
  A.seedMock = async function () {
    if (!SN.mock) return;
    var db = be()._db();
    if (db.users.length) return;
    await be().signUp('Demo Host', 'host@example.com', 'password123');
    await be().signOut();
    await be().signUp('Admin', (C.ADMIN_EMAILS || ['admin@example.com'])[0], 'password123');
    await be().signOut();
    var ev = await A.createEvent({ eventName: "Riya & Arjun's Sangeet", tier: 'single', hostEmail: 'host@example.com', theme: 'default' });
    for (var i = 0; i < 9; i++) {
      var dataUrl = SN.samplePhoto(i + 1, 480), blob = await (await fetch(dataUrl)).blob();
      await A.addUpload({ eventId: ev.eventId, blob: blob, name: 'photo' + i + '.jpg', mime: 'image/jpeg', kind: 'image' });
    }
  };
})();

<section class="auth">
  <div class="card auth-card">
    <a class="logo lg" href="index.html" aria-label="SnapNexus home"><img src="logo.png" alt="SnapNexus"></a>
    <h1>Set a new password</h1>
    <p class="sub" id="sub">Choose a password with at least 8 characters.</p>
    <div class="notice err" id="err" hidden style="margin-bottom:14px"></div>
    <form class="stack" id="f" novalidate>
      <div class="field"><label class="label" for="p1">New password</label><input class="input" id="p1" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label class="label" for="p2">Repeat password</label><input class="input" id="p2" type="password" autocomplete="new-password" minlength="8" required></div>
      <button class="btn btn-primary btn-block btn-lg" id="go" type="submit">Save password</button>
    </form>
    <div id="done" hidden style="text-align:center">
      <div class="notice ok" style="margin-bottom:18px"><span>Password updated. You can sign in now.</span></div>
      <a class="btn btn-primary btn-block" href="login.html">Go to sign in</a>
    </div>
  </div>
</section>
<script>
(function () {
  'use strict';
  var S = window.SN, uid = S.qs('userId'), secret = S.qs('secret');
  function fail(m) { var e = S.$('#err'); e.innerHTML = S.icon('triangle-alert') + '<span>' + S.esc(m) + '</span>'; e.hidden = false; }
  if (!uid || !secret) { fail('This reset link is incomplete. Request a new one from the sign-in page.'); S.$('#f').hidden = true; }
  S.$('#f').addEventListener('submit', async function (ev) {
    ev.preventDefault(); S.$('#err').hidden = true;
    var a = S.$('#p1').value, b = S.$('#p2').value;
    if (a.length < 8) return fail('Password must be at least 8 characters.');
    if (a !== b) return fail('The two passwords don\'t match.');
    var btn = S.$('#go'); S.ui.busy(btn, true, 'Saving…');
    try {
      S.api.ready();
      await S.api.resetPassword(uid, secret, a);
      S.$('#f').hidden = true; S.$('#sub').hidden = true; S.$('#done').hidden = false;
      S.track('password_reset_done');
    } catch (e) {
      S.ui.busy(btn, false);
      fail(/invalid|expired|not found/i.test(e.message || '') ? 'This reset link has expired or was already used. Request a new one from the sign-in page.' : S.errMsg(e));
    }
  });
})();
</script>
