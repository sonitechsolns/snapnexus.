<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <script src="/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapNexus | Live TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Urbanist:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Urbanist',sans-serif; background:#020617; color:#ffffff; overflow:hidden; height:100vh; width:100vw; }
        
        .liquid-mesh { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-3; background:radial-gradient(circle at 20% 30%, #020617, #1e3a8a 30%, #3b82f6 65%, #4f46e5); background-size:200% 200%; animation: meshAnim 15s ease infinite alternate; }
        @keyframes meshAnim { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        
        /* The Un-collapsible QR Sidebar */
        .sidebar { position: absolute; left: 0; top: 0; width: 300px; height: 100vh; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); padding: 40px 20px; display: flex; flex-direction: column; align-items: center; z-index: 10; border-right: 1px solid rgba(255,255,255,0.1); }
        .sidebar h1 { font-family: 'Syne'; font-size: 2rem; margin-bottom: 20px; text-align: center; }
        .qr-placeholder { width: 200px; height: 200px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: black; font-weight: bold; margin-bottom: 20px; }
        
        .slideshow-container { position: absolute; left: 300px; width: calc(100vw - 300px); height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; }
        .photo-layer { position: absolute; max-width: 85%; max-height: 85%; object-fit: contain; opacity: 0; transform: scale(0.95); transition: opacity 1s ease, transform 1s ease; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .photo-layer.active { opacity: 1; transform: scale(1); }
        
        /* The "Ad" Ribbon Header/Footer */
        .ad-banner { position: absolute; bottom: 0; left: 300px; width: calc(100vw - 300px); height: 120px; background: rgba(0,0,0,0.8); border-top: 1px solid rgba(255,255,255,0.1); overflow: hidden; z-index: 15; }
        .ad-pic { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; opacity: 0; transition: opacity 1s ease; }
        .ad-pic.active { opacity: 1; }
        
        .watermark { position: absolute; top: 30px; right: 40px; font-size: 1.2rem; color: rgba(255,255,255,0.6); font-weight: 800; font-family: 'Syne'; z-index: 10; text-shadow: 0 2px 10px black; }
    </style>
</head>
<body>
    <div class="liquid-mesh"></div>
    
    <div class="sidebar">
        <h1 id="tvEventName">Live Event</h1>
        <p style="margin-bottom: 10px; color: #bfdbfe;">Scan to upload!</p>
        <div class="qr-placeholder">
            <img id="qrImage" src="" style="width: 100%; border-radius: 10px;">
        </div>
        <p style="margin-top: auto; font-size: 0.9rem; color: #94a3b8; text-align: center;">Want this full screen? Host can upgrade to VIP.</p>
    </div>

    <div class="slideshow-container">
        <img id="layer1" class="photo-layer" src="" alt="">
        <img id="layer2" class="photo-layer" src="" alt="">
    </div>

    <div class="watermark">Powered by SnapNexus</div>
    
    <div class="ad-banner" id="adBanner">
        <img class="ad-pic active" id="adPic1" src="https://images.unsplash.com/photo-1549451371-64aa98a6fcf0?w=1920&q=80" />
        <img class="ad-pic" id="adPic2" src="https://images.unsplash.com/photo-1549451371-64aa98a6fcf0?w=1920&q=80" />
        <img class="ad-pic" id="adPic3" src="https://images.unsplash.com/photo-1549451371-64aa98a6fcf0?w=1920&q=80" />
    </div>

    <script>
        const cfg = window.SnapNexus;
        const client = new Appwrite.Client()
            .setEndpoint(cfg.ENDPOINT)
            .setProject(cfg.PROJECT_ID);
        const databases = new Appwrite.Databases(client);
        const storage = new Appwrite.Storage(client);

        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event');
        const isDemo = urlParams.get('isDemo') === 'true';
        if (!eventId) { document.body.innerHTML = '<h1 style="color:white; text-align:center; padding-top:20vh;">Invalid Link</h1>'; throw new Error("Halt"); }

        document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(cfg.resolveUrl(`app.html?event=${eventId}`))}`;

        let photos = [];
        let currentIndex = 0;
        let activeLayer = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            const layer1 = document.getElementById('layer1');
            const layer2 = document.getElementById('layer2');

            if (isDemo) {
                document.getElementById('tvEventName').innerText = 'Live Demo Room';
            } else {
                try {
                    const res = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [ Appwrite.Query.equal('eventId', eventId) ]);
                    if (res.documents.length > 0) document.getElementById('tvEventName').innerText = res.documents[0].eventName;
                } catch(e) { console.error(e); }
            }

            async function fetchPhotos() {
                try {
                    const res = await storage.listFiles(cfg.BUCKET_ID, [
                        Appwrite.Query.startsWith('name', eventId + '_'), Appwrite.Query.limit(100), Appwrite.Query.orderDesc('$createdAt')
                    ]);
                    const newUrls = res.files.map(f => storage.getFileView(cfg.BUCKET_ID, f.$id).href);
                    if (JSON.stringify(newUrls) !== JSON.stringify(photos)) {
                        photos = newUrls;
                        if (photos.length > 0 && !layer1.classList.contains('active') && !layer2.classList.contains('active')) {
                            layer1.src = photos[0]; layer1.classList.add('active');
                        }
                    }
                } catch(e) {}
            }

            function nextSlide() {
                if (photos.length === 0) return;
                currentIndex = (currentIndex + 1) % photos.length;
                const nextUrl = photos[currentIndex];
                if (activeLayer === 1) { layer2.src = nextUrl; layer2.classList.add('active'); layer1.classList.remove('active'); activeLayer = 2; }
                else { layer1.src = nextUrl; layer1.classList.add('active'); layer2.classList.remove('active'); activeLayer = 1; }
            }

            fetchPhotos(); setInterval(fetchPhotos, 1500); setInterval(nextSlide, 4500);
            
            async function checkEventStatus() {
                if (isDemo) return;
                try {
                    const res = await databases.listDocuments(cfg.DATABASE_ID, cfg.COLLECTION_ID, [ Appwrite.Query.equal('eventId', eventId) ]);
                    if (res.documents.length > 0 && res.documents[0].status === 'ended') {
                        document.body.innerHTML = '<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; width:100vw; background:#020617; z-index:9999; position:absolute; top:0; left:0;"><h1 style="font-size: 4rem; color: #ef4444; font-family:\'Syne\';">Event Ended</h1><p style="color: #94a3b8; font-size: 1.5rem; margin-top: 10px;">Thanks for participating! - SnapNexus</p></div>';
                    }
                } catch(e) {}
            }
            setInterval(checkEventStatus, 5000);
            
            // Ad Loading & Rotation Logic
            const ads = [document.getElementById('adPic1'), document.getElementById('adPic2'), document.getElementById('adPic3')];
            let currentAdIndex = 0;
            
            // Initial load
            const fallback = "https://images.unsplash.com/photo-1549451371-64aa98a6fcf0?w=1920&q=80";
            for (let i=1; i<=3; i++) {
                const url = `${cfg.ENDPOINT}/storage/buckets/${cfg.BUCKET_ID}/files/global_ad_${i}/view?project=${cfg.PROJECT_ID}`;
                const imgCheck = new Image();
                imgCheck.onload = () => { if (ads[i-1]) ads[i-1].src = url; };
                imgCheck.onerror = () => { if (ads[i-1]) ads[i-1].src = fallback; };
                imgCheck.src = url;
            }

            setInterval(() => {
                const currentAd = ads[currentAdIndex];
                if(currentAd) currentAd.classList.remove('active');
                
                currentAdIndex = (currentAdIndex + 1) % ads.length;
                const nextAd = ads[currentAdIndex];
                
                if(nextAd) nextAd.classList.add('active');
            }, 10000);
        });
    </script>
</body>
</html>
