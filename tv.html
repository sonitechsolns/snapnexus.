<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#061022">
<meta name="robots" content="noindex">
<title>Live Wall · SnapNexus</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* SnapNexus design system — shared by every page.
   Brand colours come from the current logo (amber wordmark on deep blue).
   To re-brand later, change the tokens in :root only. Guest/TV pages override
   the same tokens from the event's theme at runtime. */
:root{
  --bg:#050b18; --bg-2:#081328; --bg-3:#0c1a36;
  --surface:rgba(16,30,60,.52); --surface-solid:#0d1a33; --surface-hi:rgba(28,48,92,.6);
  --line:rgba(150,180,255,.10); --line-2:rgba(150,180,255,.20);
  --text:#f2f5fb; --muted:#9dabc6; --dim:#6a7894;
  --accent:#f5b301; --accent-2:#ffd34d; --accent-rgb:245,179,1; --on-accent:#1b1303;
  --blue:#2f6fe4; --blue-rgb:47,111,228;
  --ok:#10b981; --warn:#f59e0b; --danger:#f43f5e;
  --radius:22px; --radius-sm:14px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --head:'Syne','Inter',sans-serif;
  --shadow:0 24px 70px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.sn-bg{background:
  radial-gradient(900px 600px at 12% -10%,rgba(var(--blue-rgb),.28),transparent 60%),
  radial-gradient(700px 500px at 100% 0%,rgba(var(--blue-rgb),.16),transparent 60%),
  radial-gradient(800px 500px at 50% 120%,rgba(var(--accent-rgb),.07),transparent 60%),
  var(--bg);background-attachment:fixed}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--head);line-height:1.1;letter-spacing:-.02em;margin:0}
p{margin:0}
.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 20px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.accent{color:var(--accent)}
.row{display:flex;align-items:center;gap:12px}
.row.wrap-ok{flex-wrap:wrap}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}

/* logo */
.logo{display:inline-flex;align-items:center}
.logo img{height:22px;width:auto}
.logo.lg img{height:30px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:600;font-size:.95rem;border:1px solid transparent;background:none;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s,opacity .2s;white-space:nowrap;text-align:center;line-height:1.2}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--on-accent);box-shadow:0 0 24px rgba(var(--accent-rgb),.22)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(var(--accent-rgb),.38)}
.btn-ghost{background:rgba(255,255,255,.04);border-color:var(--line-2);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{filter:brightness(1.1)}
.btn-danger{background:rgba(244,63,94,.1);border-color:rgba(244,63,94,.35);color:#fda4b4}
.btn-danger:hover{background:rgba(244,63,94,.18)}
.btn-sm{padding:8px 14px;font-size:.85rem}
.btn-lg{padding:16px 28px;font-size:1.05rem}
.btn-block{width:100%}
.btn-icon{width:40px;height:40px;padding:0;border-radius:12px}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card-pad{padding:24px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-family:var(--head);font-size:1.15rem;font-weight:700}
.card-h .i{color:var(--accent)}
.card-sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}

/* forms */
.field{display:flex;flex-direction:column;gap:7px}
.label{font-size:.85rem;font-weight:600;color:var(--muted)}
.input,.select,.textarea{width:100%;background:rgba(3,8,20,.55);border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:13px 15px;outline:none;transition:border-color .2s,box-shadow .2s;color:var(--text)}
.input::placeholder{color:var(--dim)}
.input:focus,.select:focus,.textarea:focus{border-color:rgba(var(--accent-rgb),.7);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.14)}
.select{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
.select option{background:var(--surface-solid)}
.input-wrap{position:relative}
.input-wrap .btn-icon{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;color:var(--muted)}
input[type=color]{-webkit-appearance:none;appearance:none;border:0;width:34px;height:34px;padding:0;border-radius:50%;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:2px solid rgba(255,255,255,.3);border-radius:50%}
input[type=color]::-moz-color-swatch{border:2px solid rgba(255,255,255,.3);border-radius:50%}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--muted);background:rgba(255,255,255,.03);white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.live{color:#34d399;border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.08)}
.badge.ended{color:#fb7185;border-color:rgba(244,63,94,.35);background:rgba(244,63,94,.08)}
.badge.trial{color:#93c5fd;border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.08)}
.badge.single{color:var(--accent-2);border-color:rgba(var(--accent-rgb),.4);background:rgba(var(--accent-rgb),.08)}
.badge.pro{color:var(--on-accent);border-color:transparent;background:linear-gradient(180deg,var(--accent-2),var(--accent))}
.badge.warn{color:#fcd34d;border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08)}
.badge.pulse .dot{animation:snPulse 1.6s infinite}
@keyframes snPulse{50%{opacity:.3}}

/* top bar (host pages) */
.topbar{position:sticky;top:0;z-index:40;background:rgba(5,11,24,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar .wrap{height:64px;display:flex;align-items:center;gap:14px}
.topbar .who{font-size:.85rem;color:var(--muted);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:600px){.topbar .who{display:none}}

/* segmented control */
.seg{display:flex;padding:4px;border-radius:999px;background:rgba(0,0,0,.25);background:color-mix(in srgb,var(--text) 6%,transparent);border:1px solid var(--line-2);position:relative}
.seg button{flex:1;white-space:nowrap;border:0;background:none;padding:10px 14px;border-radius:999px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:7px;position:relative;z-index:1;transition:color .2s}
.seg button[aria-pressed=true]{color:var(--on-accent);background:var(--accent)}

/* toasts */
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;padding:13px 16px;border-radius:14px;background:rgba(10,20,40,.94);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:.92rem;font-weight:500;color:#fff;opacity:0;transform:translateY(-10px);transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:none}
.toast .i{margin-top:1px}
.toast.ok .i{color:#34d399} .toast.err .i{color:#fb7185} .toast.info .i{color:#93c5fd}

/* modal */
.modal{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,5,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.modal-box{width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-solid);border:1px solid var(--line-2);border-radius:24px;padding:26px;box-shadow:var(--shadow);transform:translateY(12px) scale(.98);transition:transform .25s}
.modal.open .modal-box{transform:none}
.modal-box.wide{max-width:640px}
.modal-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.modal-head h3{font-size:1.35rem;flex:1}
.modal-head .btn-icon{margin:-8px -8px 0 0;color:var(--muted)}

/* misc */
.spin{animation:snSpin 1s linear infinite}
@keyframes snSpin{to{transform:rotate(360deg)}}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:.95rem}
.empty .i{width:32px;height:32px;color:var(--dim);margin:0 auto 10px;display:block}
.skel{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:snSkel 1.2s infinite}
@keyframes snSkel{to{background-position:-200% 0}}
.divider{height:1px;background:var(--line);margin:18px 0}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em;background:rgba(255,255,255,.06);border:1px solid var(--line-2);padding:2px 7px;border-radius:7px}
.notice{display:flex;gap:10px;padding:13px 15px;border-radius:14px;font-size:.9rem;border:1px solid var(--line-2);background:rgba(255,255,255,.03)}
.notice .i{flex:none;margin-top:2px}
.notice.warn{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.07);color:#fde68a}
.notice.err{border-color:rgba(244,63,94,.35);background:rgba(244,63,94,.07);color:#fecdd3}
.notice.ok{border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.07);color:#a7f3d0}
.notice.info{border-color:rgba(var(--blue-rgb),.4);background:rgba(var(--blue-rgb),.08);color:#bfdbfe}
.mock-flag{position:fixed;left:12px;bottom:12px;z-index:2000;background:#f43f5e;color:#fff;font-size:.7rem;font-weight:800;letter-spacing:.1em;padding:5px 10px;border-radius:99px;text-transform:uppercase;opacity:.9;text-decoration:none}
.foot-mini{padding:28px 0 36px;color:var(--dim);font-size:.82rem;text-align:center}
.foot-mini a{color:var(--muted)} .foot-mini a:hover{color:#fff}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

</style>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }

    var fileUrl = f.url + (o.kind === 'video' && f.url.indexOf('data:') !== 0 ? (f.url.indexOf('?') === -1 ? '?' : '&') + 'sn_kind=video' : '');
    var payload = { file_id: f.id, event_id: o.eventId, file_url: fileUrl, is_public_wall_allowed: !o.groupId };
    if (o.groupId) payload.group_id = String(o.groupId);
    try { return await be().createUploadDoc(payload); }
    catch (e) { try { await be().delFile(f.id); } catch (x) { } throw e; }
  };
  A.removeUpload = async function (u) {
    await be().deleteUploadDoc(u.$id);
    if (u.file_id) { try { await be().delFile(u.file_id); } catch (e) { } }
  };
  A.updateUpload = function (id, data) { return be().updateUpload(id, data); };

  // Groups (passcodes are stored hashed)
  A.hash = async function (s) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  };
  A.groups = function (eventId) { return be().groups(eventId); };
  A.joinGroup = async function (eventId, name, pass) {
    var h = await A.hash(pass), g = await be().findGroup(eventId, name);
    if (g) { if (g.passcode !== h) throw new Error('Wrong passcode for this group.'); return { group: g, created: false }; }
    g = await be().createGroup({ event_id: eventId, group_name: name, passcode: h, created_by_token: 'anonymous_' + SN.rand(9) });
    return { group: g, created: true };
  };

  // Files / ads (ads live in storage as global_ad_1..3, as on the previous site)
  A.putFile = function (file, id) { return be().putFile(file, id); };
  A.delFile = function (id) { return be().delFile(id); };
  A.fileUrl = function (id) { return be().fileUrl(id); };
  A.logoId = function (eventId) { return ('logo_' + eventId).slice(0, 36); };
  A.logoUrl = function (ev) {
    if (ev && ev.customWatermark) return ev.customWatermark;
    if (SN.mock) return be().fileUrl(A.logoId(ev.eventId)) || '';
    return C.ENDPOINT + '/storage/buckets/' + C.BUCKET_ID + '/files/' + A.logoId(ev.eventId) + '/view?project=' + C.PROJECT_ID;
  };
  A.setLogo = async function (ev, file) {
    var fid = A.logoId(ev.eventId);
    try { await be().delFile(fid); } catch (e) { }
    await be().putFile(file, fid);
  };
  A.removeLogo = async function (ev) { await be().delFile(A.logoId(ev.eventId)); };
  A.adUrl = function (slot) {
    if (SN.mock) return be().fileUrl('global_ad_' + slot) || '';
    return C.ENDPOINT + '/storage/buckets/' + C.BUCKET_ID + '/files/global_ad_' + slot + '/view?project=' + C.PROJECT_ID;
  };

  // Mock-only: seed a realistic demo account so every page can be tried end-to-end
  A.seedMock = async function () {
    if (!SN.mock) return;
    var db = be()._db();
    if (db.users.length) return;
    await be().signUp('Demo Host', 'host@example.com', 'password123');
    await be().signOut();
    await be().signUp('Admin', (C.ADMIN_EMAILS || ['admin@example.com'])[0], 'password123');
    await be().signOut();
    var ev = await A.createEvent({ eventName: "Riya & Arjun's Sangeet", tier: 'single', hostEmail: 'host@example.com', theme: 'default' });
    for (var i = 0; i < 9; i++) {
      var dataUrl = SN.samplePhoto(i + 1, 480), blob = await (await fetch(dataUrl)).blob();
      await A.addUpload({ eventId: ev.eventId, blob: blob, name: 'photo' + i + '.jpg', mime: 'image/jpeg', kind: 'image' });
    }
  };
})();

<style>
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);font-size:1.4vh}
  body.idle,body.idle *{cursor:none!important}
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:
    radial-gradient(60vw 50vh at 10% 0%,rgba(var(--glow-rgb,47,111,228),.28),transparent 70%),
    radial-gradient(50vw 50vh at 100% 100%,rgba(var(--accent-rgb),.12),transparent 70%)}
  .tv{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:1fr auto;grid-template-rows:1fr auto;gap:1.6vh;padding:1.8vh}
  body.qr-corner .tv,body.qr-hidden .tv{grid-template-columns:1fr}
  body.qr-corner .side,body.qr-hidden .side{display:none}
  body.lay-slideshow.qr-corner .tv,body.lay-slideshow.qr-hidden .tv{padding:0;gap:0}
  body.lay-slideshow.qr-corner .ads,body.lay-slideshow.qr-hidden .ads{border-radius:0}

  /* ---------- wall (shared) ---------- */
  .wall{grid-column:1;grid-row:1;position:relative;min-height:0;min-width:0}
  .tile{position:relative;overflow:hidden;border-radius:1.6vh;background:var(--surface);border:1px solid var(--line)}
  .tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
  .tile.new{animation:pop .9s cubic-bezier(.2,1.4,.4,1)}
  .tile.new::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5vh var(--accent);animation:ring 1.8s ease-out forwards;pointer-events:none}
  @keyframes pop{from{transform:scale(.6);filter:brightness(2)}to{transform:none;filter:none}}
  @keyframes ring{from{opacity:1}to{opacity:0}}
  .pin{position:absolute;top:1vh;left:1vh;z-index:2;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:.4vh 1vh;font-size:1.3vh;font-weight:700;display:flex;gap:.5vh;align-items:center}
  .ph{background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}
  .bgblur{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(3vh) brightness(.55);transform:scale(1.1)}
  .fit{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

  /* spotlight: one big + 8 */
  .wall.spotlight{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:1.2vh}
  .tile.spot{grid-column:span 2;grid-row:span 2;border-radius:2.2vh;box-shadow:0 2vh 6vh rgba(0,0,0,.35)}
  .tile.spot .layer{position:absolute;inset:0;transition:opacity .8s}

  /* grid: equal tiles */
  .wall.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:1.2vh}
  .wall.grid .tile .layer{position:absolute;inset:0;transition:opacity .8s}

  /* slideshow + split: cross-fading layers */
  .wall.slideshow,.pane{position:relative;overflow:hidden;border-radius:2.2vh;background:#000}
  body.lay-slideshow.qr-corner .wall.slideshow,body.lay-slideshow.qr-hidden .wall.slideshow{border-radius:0}
  .wall.split{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
  .slide.on{opacity:1}
  .slide.kb .fit{animation:kb var(--kbd,8s) ease-out forwards}
  @keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.07) translate(var(--kx,0),var(--ky,0))}}
  .slide .pin{top:2vh;left:2vh;font-size:1.6vh}

  /* ---------- sidebar ---------- */
  .side{grid-column:2;grid-row:1 / span 2;width:24vw;min-width:260px;max-width:460px;display:flex;flex-direction:column;gap:2vh;padding:3vh 2.4vh;border-radius:2.2vh;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .side .logo-slot img{max-height:9vh;max-width:100%;object-fit:contain;margin:0 auto}
  .ev-kicker{font-size:1.3vh;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--muted);text-align:center}
  .ev-title{font-family:var(--head);font-size:clamp(20px,3.6vh,52px);font-weight:700;color:var(--accent);text-align:center;line-height:1.1;word-break:break-word}
  .qr{background:#fff;border-radius:2vh;padding:1.6vh;margin:0 auto;width:100%;max-width:30vh;box-shadow:0 2vh 5vh rgba(0,0,0,.35)}
  .qr svg,.qr img,.qrc svg,.qrc img{width:100%;height:auto;display:block}
  .scan{text-align:center}
  .scan b{display:block;font-family:var(--head);font-size:2.6vh;margin-bottom:.4vh}
  .scan span{color:var(--muted);font-size:1.6vh}
  .stats{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:1vh;font-size:1.6vh;color:var(--muted)}
  .stats .count{font-family:var(--head);font-size:3.4vh;color:var(--text);font-weight:700;line-height:1}
  .live{display:inline-flex;align-items:center;gap:.8vh;padding:.6vh 1.4vh;border-radius:99px;background:rgba(244,63,94,.14);color:#fecdd3;font-weight:700;letter-spacing:.14em;font-size:1.3vh}
  .live i{width:1vh;height:1vh;border-radius:50%;background:#f43f5e;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.25}}
  .brand-foot{text-align:center;font-size:1.3vh;color:var(--muted)} .brand-foot b{color:var(--text)}

  /* ---------- corner QR ---------- */
  .corner{position:fixed;right:3vh;bottom:calc(var(--adh,0px) + 3vh);z-index:6;display:none;align-items:center;gap:1.6vh;padding:1.4vh;padding-right:2.2vh;border-radius:2vh;background:rgba(6,10,20,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);color:#fff;max-width:40vw}
  body.qr-corner .corner{display:flex}
  .qrc{width:13vh;background:#fff;border-radius:1.2vh;padding:.8vh;flex:none}
  .corner b{display:block;font-family:var(--head);font-size:2.3vh;line-height:1.15}

  /* ---------- ads ---------- */
  .ads{grid-column:1;grid-row:2;height:10vh;border-radius:1.6vh;overflow:hidden;position:relative;background:linear-gradient(90deg,#0b2a6b,#123b91);border:1px solid rgba(255,255,255,.1)}
  .ad{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2vh;padding:0 3vh;opacity:0;transform:translateY(20%);transition:opacity .7s,transform .7s;color:#fff;font-weight:600;font-size:2.2vh;text-align:center}

  .ad img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .ad .tag{position:absolute;right:1.2vh;top:.8vh;font-size:1.1vh;letter-spacing:.14em;text-transform:uppercase;opacity:.6;z-index:1}
  .ad .yl{color:#ffd34d}

  .toast-new{position:fixed;left:3vh;bottom:calc(var(--adh,0px) + 3vh);z-index:7;display:flex;align-items:center;gap:1.2vh;padding:1vh 2vh 1vh 1vh;border-radius:99px;background:rgba(6,10,20,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-weight:600;font-size:1.8vh;border:1px solid rgba(255,255,255,.15);opacity:0;transform:translateY(40%);transition:.4s}
  .toast-new.show{opacity:1;transform:none}
  .toast-new .av{width:3.4vh;height:3.4vh;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
  .toast-new .av .i{width:1.8vh;height:1.8vh}

  .hint.show{opacity:1}

  .over{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;text-align:center;padding:4vh;background:var(--bg)}

  .over .big .i{width:6vh;height:6vh}

  .over p{color:var(--muted);font-size:clamp(16px,2.4vh,30px);max-width:60vw}
  .waiting{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;border:2px dashed var(--line-2);border-radius:2.2vh;background:var(--bg)}

  @media (orientation: portrait){
    .tv{grid-template-columns:1fr!important;grid-template-rows:1fr auto auto}

<div class="bgfx"></div>
<div class="tv" id="tv">
  <section class="wall" id="wall" aria-live="polite"></section>
  <aside class="side" id="side">
    <div class="logo-slot" id="logoSlot" hidden><img id="logoImg" alt=""></div>
    <div><p class="ev-kicker">Live photo wall</p><h1 class="ev-title" id="evTitle">…</h1></div>
    <div class="qr" id="qr"></div>
    <div class="scan"><b>Scan to share</b><span>Point your camera at the code. No app needed.</span></div>
    <div class="stats"><div><div class="count" id="count">0</div>photos</div><span class="live"><i></i>LIVE</span></div>
    <p class="brand-foot" id="brandFoot">Powered by <b>SnapNexus</b></p>
  </aside>
  <section class="ads" id="ads" hidden></section>
</div>

  <div class="qrc" id="qrc"></div>
  <div><img class="cl-logo" id="cLogo" alt="" hidden><b>Scan to share</b><div class="ct" id="cTitle"></div><div class="cl"><i></i>LIVE · <span id="cCount">0</span></div></div>
</div>
<div class="toast-new" id="toastNew"><span class="av" id="toastIcon"></span><span id="toastTxt">New photo!</span></div>
<div class="hint" id="hint"></div>

<div class="controls" id="controls">
  <button class="btn btn-sm" id="btnFs"></button>
  <button class="btn btn-sm" id="btnLayout"></button>
  <button class="btn btn-sm" id="btnQr"></button>
</div>

<div class="over" id="over" hidden>
  <div class="big" id="overIcon"></div>
  <h1 id="overTitle"></h1>
  <p id="overText"></p>
</div>

<script>
(function () {
  'use strict';
  var S = window.SN, C = S.cfg, I = S.icon, esc = S.esc, W = S.wall;
  var eventId = S.qs('event');
  var isDemo = !!eventId && eventId.indexOf('demo_') === 0;
  var ev = null, all = [], items = [], known = {}, firstLoad = true;
  var opts = Object.assign({}, W.DEFAULT), local = {};   // saved options + on-the-spot overrides (keyboard)
  var queue = [], cursor = 0, cur = null, timer = null, layoutKey = null;

  S.$('#btnFs').innerHTML = I('maximize') + '<span>Fullscreen</span>';
  S.$('#toastIcon').innerHTML = I('camera');

  function overlay(kind) {
    var map = {
      missing: ['circle-x', 'Wall not found', 'This link doesn\'t match an event. Open the wall again from your dashboard.'],
      ended: ['circle-check', 'That\'s a wrap!', 'Thanks for sharing your moments. This event has ended.'],
      trial_over: ['clock', 'Free trial ended', 'The host can upgrade from their SnapNexus dashboard to keep this wall live.'],
      unpaid: ['clock', 'Almost ready', 'This wall goes live as soon as the host\'s payment is confirmed.'],
      error: ['triangle-alert', 'Connection lost', 'We\'ll keep trying to reconnect…']
    }[kind];
    S.$('#overIcon').innerHTML = I(map[0]);
    S.$('#overTitle').textContent = map[1];
    S.$('#overText').textContent = map[2];
    S.$('#over').hidden = false;
  }
  function clearOverlay() { S.$('#over').hidden = true; }
  function eff() { return Object.assign({}, opts, local); }

  /* ================= event + chrome ================= */
  async function loadEvent() {
    if (!eventId) { overlay('missing'); return false; }
    if (isDemo) {
      ev = { eventId: eventId, eventName: 'Live Demo', tier: 'starter', status: 'active', theme: S.qs('look') || 'default', $createdAt: new Date().toISOString() };
    } else {
      var fresh;
      try { fresh = await S.api.getEvent(eventId); } catch (e) { if (!ev) overlay('error'); return !!ev; }
      if (!fresh) { overlay('missing'); return false; }
      var changed = !ev || ev.theme !== fresh.theme || ev.eventName !== fresh.eventName || ev.tier !== fresh.tier;
      ev = fresh;
      if (!changed) { applyState(); return true; }
    }
    S.theme.apply(S.theme.parse(ev.theme));
    var newOpts = W.parse(ev.theme);
    if (JSON.stringify(newOpts) !== JSON.stringify(opts)) {
      opts = newOpts;
      if (window.__optsLoaded) local = {};   // host saved new settings: they win over keyboard tweaks
      window.__optsLoaded = true;
      applyOptions(true);
    } else window.__optsLoaded = true;
    document.title = ev.eventName + ' · Live Wall';
    S.$('#evTitle').textContent = ev.eventName;
    S.$('#cTitle').textContent = ev.eventName;
    var joinUrl = C.resolveUrl('app.html?event=' + encodeURIComponent(ev.eventId));
    S.$('#qr').innerHTML = S.ui.qrSvg(joinUrl, { margin: 1 });
    S.$('#qrc').innerHTML = S.ui.qrSvg(joinUrl, { margin: 1 });
    var pro = S.plans.norm(ev.tier) === 'pro';
    S.$('#logoSlot').hidden = true; S.$('#cLogo').hidden = true;
    if (pro) {
      var lu = S.api.logoUrl(ev), li = S.$('#logoImg'), cl = S.$('#cLogo');
      li.onload = function () { S.$('#logoSlot').hidden = false; cl.src = li.src; cl.hidden = false; };
      li.onerror = function () { S.$('#logoSlot').hidden = true; cl.hidden = true; };
      if (lu) li.src = lu + (lu.indexOf('data:') === 0 ? '' : (lu.indexOf('?') > -1 ? '&' : '?') + 't=' + Math.floor(Date.now() / 300000));
    }
    S.$('#brandFoot').hidden = pro;
    setupAds(isDemo || S.plans.hasAds(ev));
    applyState();
    if (!window.__tracked) { window.__tracked = 1; S.track('wall_opened', { plan: S.plans.norm(ev.tier), demo: isDemo, layout: opts.layout }); }
    return true;
  }
  function applyState() {
    var st = isDemo ? 'live' : S.plans.wallState(ev);
    if (st === 'live') clearOverlay(); else overlay(st);
    return st;
  }

  /* ================= ads (free trial + unpaid) ================= */
  var adTimer = null, adsOn = null;
  function setupAds(on) {
    if (adsOn === on) return; adsOn = on;
    var box = S.$('#ads'); box.hidden = !on; clearInterval(adTimer);
    document.documentElement.style.setProperty('--adh', on ? 'calc(10vh + 1.8vh)' : '0px');
    if (!on) return;
    var text = [
      '<span>Host your own live photo wall at <b class="yl">snapnexus.in</b>. Free for 1 hour.</span>',
      '<span>Loving this? Remove ads from ₹' + C.PLANS.single.price + ' per event at <b class="yl">snapnexus.in</b></span>',
      '<span>Websites by <b class="yl">Soni Tech Solutions</b></span>'
    ];
    box.innerHTML = '';
    var slides = [];
    function addSlide(html) { var d = document.createElement('div'); d.className = 'ad'; d.innerHTML = '<span class="tag">Ad</span>' + html; box.appendChild(d); slides.push(d); }
    var pending = 3, imgs = [];
    for (var n = 1; n <= 3; n++) (function (n) {
      var u = S.api.adUrl(n); if (!u) { if (--pending === 0) done(); return; }
      var im = new Image();
      im.onload = function () { imgs[n] = u; if (--pending === 0) done(); };
      im.onerror = function () { if (--pending === 0) done(); };
      im.src = u;
    })(n);
    function done() {
      imgs.forEach(function (u) { if (u) addSlide('<img alt="Sponsor" src="' + esc(u) + '">'); });
      text.forEach(addSlide);
      var i = 0; slides[0].classList.add('on');
      adTimer = setInterval(function () { slides[i].classList.remove('on'); i = (i + 1) % slides.length; slides[i].classList.add('on'); }, 7000);
    }
  }

  /* ================= photos + playlist ================= */
  var demoSeed = [];
  if (isDemo) for (var k = 1; k <= 11; k++) demoSeed.push({ $id: 'demo' + k, file_url: S.samplePhoto(k, 640), $createdAt: new Date(Date.now() - k * 60000).toISOString(), is_pinned: false, demo: true });
  function isPinned(d) { return d.is_pinned === true || d.is_pinned === 'true'; }
  function isVid(d) { return S.isVideoUrl(d.file_url); }
  function filterMedia() { items = eff().media === 'photos' ? all.filter(function (d) { return !isVid(d); }) : all.slice(); }
  // Newest first; pinned photos (Pro) come back every 3 items so they get extra screen time
  function playlist() {
    var pinned = items.filter(isPinned), rest = items.filter(function (d) { return !isPinned(d); });
    if (!pinned.length) return rest;
    var out = [], p = 0;
    rest.forEach(function (d, i) { out.push(d); if (i % 3 === 2) out.push(pinned[p++ % pinned.length]); });
    if (!rest.length) return pinned;
    return out.length ? out : pinned;
  }
  function nextItem(exclude) {
    exclude = exclude || {};
    while (queue.length) { var q = queue.shift(); if (items.indexOf(q) !== -1 && !exclude[q.$id]) return q; }
    var pl = playlist(); if (!pl.length) return null;
    for (var i = 0; i < pl.length; i++) { var d = pl[cursor++ % pl.length]; if (!exclude[d.$id]) return d; }
    return pl[cursor++ % pl.length];
  }

  async function loadPhotos() {
    var docs;
    try { docs = await S.api.uploads(eventId, { publicOnly: true, limit: 100 }); } catch (e) { return; }
    docs = docs.filter(S.api.isPublic).concat(demoSeed);
    docs.sort(function (a, b) { return new Date(b.$createdAt) - new Date(a.$createdAt); });
    var fresh = firstLoad ? [] : docs.filter(function (d) { return !known[d.$id]; });
    docs.forEach(function (d) { known[d.$id] = true; });
    var removed = all.some(function (d) { return !docs.some(function (x) { return x.$id === d.$id; }); });
    var pinChange = docs.some(function (d) { var o = all.find(function (x) { return x.$id === d.$id; }); return o && isPinned(o) !== isPinned(d); });
    all = docs; filterMedia();
    S.$('#count').textContent = items.length; S.$('#cCount').textContent = items.length;
    var freshShown = fresh.filter(function (d) { return items.indexOf(d) !== -1; });
    if (firstLoad) { firstLoad = false; mount(); return; }
    if (resolveLayout() !== layoutKey || removed || pinChange || (!items.length) !== (!layout || !!layout.empty)) { mount(freshShown); if (freshShown.length) showToast(freshShown.length); return; }
    if (freshShown.length) { showToast(freshShown.length); queue = freshShown.concat(queue); if (layout && layout.onNew) layout.onNew(freshShown); }
  }

  /* ================= layouts ================= */
  function resolveLayout() {
    var l = eff().layout;
    if (l !== 'auto') return l;
    var n = items.length;
    return n < 6 ? 'slideshow' : n <= 24 ? 'spotlight' : 'grid';
  }
  function mediaHtml(d, cls, loop) {
    var u = esc(d.file_url || '');
    return isVid(d) ? '<video class="' + (cls || '') + '" src="' + u + '" autoplay muted playsinline' + (loop ? ' loop' : '') + '></video>' : '<img class="' + (cls || '') + '" src="' + u + '" alt="">';
  }
  function fitHtml(d, loop) {
    var bg = isVid(d) ? '' : '<div class="bgblur" style="background-image:url(&quot;' + esc(d.file_url) + '&quot;)"></div>';
    return bg + mediaHtml(d, 'fit', loop) + (isPinned(d) ? '<span class="pin">' + I('pin') + 'Pinned</span>' : '');
  }
  function pinTag(d) { return isPinned(d) ? '<span class="pin">' + I('pin') + 'Pinned</span>' : ''; }
  var layout = null;
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(step, ms); }
  function step() { if (!layout || document.hidden) { schedule(1500); return; } layout.step(); }
  function secs() { return eff().secs * 1000; }

  function waiting(wall) {
    wall.innerHTML = '<div class="waiting">' + I('camera') + '<h2>Be the first to share!</h2><p>Scan the QR code and your photo shows up here in seconds.</p></div>';
  }

  // A cross-fading "stage" used by Slideshow (one) and Split (two)
  function Stage(el, opts2) {
    var layers = [document.createElement('div'), document.createElement('div')], front = 0, shownId = null;
    layers.forEach(function (l) { l.className = 'slide'; el.appendChild(l); });
    return {
      get id() { return shownId; },
      show: function (d, onDone) {
        var back = layers[1 - front], vid = isVid(d);
        back.className = 'slide' + (vid ? '' : ' kb');
        back.style.setProperty('--kbd', (eff().secs + 2) + 's');
        back.style.setProperty('--kx', (Math.random() * 3 - 1.5).toFixed(2) + '%');
        back.style.setProperty('--ky', (Math.random() * 3 - 1.5).toFixed(2) + '%');
        back.innerHTML = fitHtml(d, !opts2.waitVideo);
        var old = layers[front];
        requestAnimationFrame(function () { back.classList.add('on'); old.classList.remove('on'); });
        setTimeout(function () { var v = old.querySelector('video'); if (v) v.pause(); if (!old.classList.contains('on')) old.innerHTML = ''; }, 1400);
        front = 1 - front; shownId = d.$id;
        if (!onDone) return;
        var v = back.querySelector('video');
        if (vid && v && opts2.waitVideo) {
          var fired = false, finish = function () { if (fired) return; fired = true; onDone(400); };
          v.addEventListener('ended', finish); v.addEventListener('error', function () { finish(); });
          setTimeout(finish, 30000); // never get stuck on a long clip
        } else onDone(secs());
      }
    };
  }

  var LAYOUTS = {
    slideshow: function (wall) {
      wall.className = 'wall slideshow';
      var st = Stage(wall, { waitVideo: true }), lastShow = 0;
      function next() { clearTimeout(timer); var d = nextItem(st.id ? (function () { var o = {}; o[st.id] = 1; return items.length > 1 ? o : {}; })() : null); if (!d) return schedule(2000); lastShow = Date.now(); st.show(d, schedule); }
      return { step: next, start: next, onNew: function () { if (Date.now() - lastShow > 2500) next(); } };
    },
    split: function (wall) {
      wall.className = 'wall split';
      var panes = [0, 1].map(function () { var p = document.createElement('div'); p.className = 'pane'; wall.appendChild(p); return Stage(p, { waitVideo: false }); });
      var side = 0;
      function vis() { var o = {}; panes.forEach(function (p) { if (p.id) o[p.id] = 1; }); return o; }
      function next() { var ex = items.length > 2 ? vis() : {}; var d = nextItem(ex); if (!d) return schedule(2000); panes[side].show(d); side = 1 - side; schedule(secs()); }
      function start() { var a = nextItem(); if (!a) return schedule(2000); panes[0].show(a); var o = {}; o[a.$id] = 1; var b = nextItem(items.length > 1 ? o : {}); if (b) panes[1].show(b); schedule(secs()); }
      return { step: next, start: start, onNew: function () { next(); } };
    },
    spotlight: function (wall, newIds) {
      wall.className = 'wall spotlight';
      var spotD = null, tiles = [];
      function render(ids) {
        ids = ids || {};
        spotD = spotD && items.indexOf(spotD) !== -1 ? spotD : nextItem();
        var rest = items.filter(function (d) { return d !== spotD; }).slice(0, 8);
        var html = '<div class="tile spot' + (ids[spotD.$id] ? ' new' : '') + '" id="spot"><div class="layer">' + fitHtml(spotD, true) + '</div></div>';
        rest.forEach(function (d) { html += '<div class="tile' + (ids[d.$id] ? ' new' : '') + '">' + mediaHtml(d, '', true) + pinTag(d) + '</div>'; });
        for (var i = rest.length; i < 8; i++) html += '<div class="tile ph"></div>';
        wall.innerHTML = html;
      }
      function rotate() {
        if (items.length < 2) return schedule(secs());
        var ex = {}; ex[spotD.$id] = 1; var d = nextItem(ex), el = S.$('#spot .layer');
        spotD = d; if (!el) { render(); return schedule(secs()); }
        el.style.opacity = '0';
        setTimeout(function () { el.innerHTML = fitHtml(d, true); el.style.opacity = '1'; }, 800);
        schedule(secs());
      }
      return {
        start: function () { if (newIds && Object.keys(newIds).length) { spotD = items.find(function (d) { return newIds[d.$id]; }) || null; queue = queue.filter(function (q) { return q !== spotD; }); } render(newIds); schedule(secs()); },
        step: rotate,
        onNew: function (fresh) { var ids = {}; fresh.forEach(function (d) { ids[d.$id] = 1; }); spotD = fresh[0]; queue = queue.filter(function (q) { return fresh.indexOf(q) === -1; }); render(ids); schedule(secs()); }
      };
    },
    grid: function (wall, newIds) {
      wall.className = 'wall grid';
      var portrait = window.matchMedia('(orientation: portrait)').matches, N = portrait ? 8 : 12, cells = [], shown = [], lastSwap = -1;
      for (var i = 0; i < N; i++) { var t = document.createElement('div'); t.className = 'tile ph'; t.innerHTML = '<div class="layer"></div>'; wall.appendChild(t); cells.push(t); }
      function put(i, d, isNew) {
        shown[i] = d; var c = cells[i], l = c.querySelector('.layer');
        c.className = 'tile'; l.style.opacity = '0';
        setTimeout(function () { l.innerHTML = mediaHtml(d, '', true) + pinTag(d); l.style.opacity = '1'; if (isNew) { c.classList.remove('new'); void c.offsetWidth; c.classList.add('new'); } }, isNew ? 0 : 700);
      }
      function vis() { var o = {}; shown.forEach(function (d) { if (d) o[d.$id] = 1; }); return o; }
      function fill(ids) {
        var list = playlist().slice(0, N);
        // newest uploads first so they're visible straight away
        list.forEach(function (d, i) { shown[i] = d; var c = cells[i]; c.className = 'tile' + (ids && ids[d.$id] ? ' new' : ''); c.querySelector('.layer').innerHTML = mediaHtml(d, '', true) + pinTag(d); });
        cursor = list.length;
      }
      function swap() {
        if (items.length <= shown.filter(Boolean).length && !queue.length) return schedule(secs());
        var d = nextItem(vis()); if (!d || vis()[d.$id]) return schedule(secs());
        var i; do { i = Math.floor(Math.random() * Math.min(N, Math.max(1, shown.length))); } while (i === lastSwap && N > 1);
        lastSwap = i; put(i, d); schedule(secs());
      }
      return {
        start: function () { fill(newIds); queue = []; schedule(secs()); },
        step: swap,
        onNew: function (fresh) {
          fresh.forEach(function (d) {
            var i = shown.length < N ? shown.length : (function () { var oldest = 0; shown.forEach(function (s, j) { if (new Date(s.$createdAt) < new Date(shown[oldest].$createdAt)) oldest = j; }); return oldest; })();
            put(i, d, true);
          });
          queue = queue.filter(function (q) { return fresh.indexOf(q) === -1; });
          schedule(secs());
        }
      };
    }
  };

  function mount(fresh) {
    clearTimeout(timer);
    var wall = S.$('#wall'); wall.innerHTML = '';
    layoutKey = resolveLayout();
    document.body.className = document.body.className.replace(/\blay-\w+/g, '').trim() + ' lay-' + layoutKey;
    if (!items.length) { wall.className = 'wall'; waiting(wall); layout = { empty: true, step: function () { schedule(3000); } }; return; }
    var ids = {}; (fresh || []).forEach(function (d) { ids[d.$id] = 1; });
    layout = LAYOUTS[layoutKey](wall, ids);
    layout.start();
  }

  /* ================= options: QR placement + controls ================= */
  function applyOptions(remount) {
    var o = eff();
    document.body.classList.remove('qr-side', 'qr-corner', 'qr-hidden');
    document.body.classList.add('qr-' + o.qr);
    S.$('#btnLayout').innerHTML = I('images') + '<span>' + W.LAYOUTS.find(function (l) { return l.key === o.layout; }).label + '</span>';
    S.$('#btnQr').innerHTML = I('qr-code') + '<span>QR: ' + W.QR.find(function (q) { return q.key === o.qr; }).label + '</span>';
    if (remount && !firstLoad) { filterMedia(); S.$('#count').textContent = items.length; mount(); }
  }
  var hintT;
  function hint(t) { var h = S.$('#hint'); h.textContent = t; h.classList.add('show'); clearTimeout(hintT); hintT = setTimeout(function () { h.classList.remove('show'); }, 1800); }
  function cycleLayout() {
    var keys = W.LAYOUTS.map(function (l) { return l.key; }), i = keys.indexOf(eff().layout);
    local.layout = keys[(i + 1) % keys.length]; applyOptions(true);
    hint('Layout: ' + W.LAYOUTS.find(function (l) { return l.key === local.layout; }).label + (local.layout === 'auto' ? ' (' + resolveLayout() + ')' : ''));
  }
  function cycleQr() {
    var keys = W.QR.map(function (q) { return q.key; }), i = keys.indexOf(eff().qr);
    local.qr = keys[(i + 1) % keys.length]; applyOptions(false); hint('QR code: ' + W.QR.find(function (q) { return q.key === local.qr; }).label);
  }
  S.$('#btnFs').addEventListener('click', toggleFs);
  S.$('#btnLayout').addEventListener('click', cycleLayout);
  S.$('#btnQr').addEventListener('click', cycleQr);
  function toggleFs() {
    if (!document.fullscreenElement) { (document.documentElement.requestFullscreen || function () { }).call(document.documentElement); }
    else document.exitFullscreen();
  }
  document.addEventListener('fullscreenchange', function () {
    S.$('#btnFs').innerHTML = document.fullscreenElement ? I('minimize') + '<span>Exit fullscreen</span>' : I('maximize') + '<span>Fullscreen</span>';
  });
  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'f') toggleFs();
    if (k === 'q') cycleQr();
    if (k === 'l') cycleLayout();
    if (k === 'arrowright' && layout && !layout.empty) { clearTimeout(timer); step(); }
  });
  var idleT;
  function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function () { document.body.classList.add('idle'); }, 3000); }
  ['mousemove', 'touchstart', 'keydown'].forEach(function (t) { document.addEventListener(t, wake, { passive: true }); });
  wake();
  var toastT;
  function showToast(n) {
    S.$('#toastTxt').textContent = n > 1 ? n + ' new photos just arrived!' : 'New photo just arrived!';
    var t = S.$('#toastNew'); t.classList.add('show'); clearTimeout(toastT);
    toastT = setTimeout(function () { t.classList.remove('show'); }, 3500);
  }
  // re-layout on rotate (portrait/landscape changes the grid size)
  window.matchMedia('(orientation: portrait)').addEventListener && window.matchMedia('(orientation: portrait)').addEventListener('change', function () { if (!firstLoad) mount(); });

  if (isDemo) { var f = document.createElement('div'); f.className = 'demo-flag'; f.textContent = 'Live demo · scan the QR with your phone to try it'; document.body.appendChild(f); }

  /* ================= boot ================= */
  (async function boot() {
    try { S.api.ready(); } catch (e) { overlay('error'); return; }
    // preview options from the dashboard's "Preview" button (not saved)
    if (W.LAYOUTS.some(function (l) { return l.key === S.qs('layout'); })) local.layout = S.qs('layout');
    if (W.SECS.indexOf(+S.qs('secs')) !== -1) local.secs = +S.qs('secs');
    if (W.QR.some(function (q) { return q.key === S.qs('qr'); })) local.qr = S.qs('qr');
    if (S.qs('media') === 'all' || S.qs('media') === 'photos') local.media = S.qs('media');
    applyOptions(false);
    var ok = await loadEvent();
    if (!ok) { setTimeout(boot, 10000); return; }
    applyOptions(false);
    await loadPhotos();
    setInterval(loadPhotos, 3000);
    setInterval(function () { if (!isDemo) loadEvent(); }, 8000);
    try { if (navigator.wakeLock) { var lock = await navigator.wakeLock.request('screen'); document.addEventListener('visibilitychange', async function () { if (!document.hidden) try { lock = await navigator.wakeLock.request('screen'); } catch (e) { } }); } } catch (e) { }
  })();
})();
</script>
